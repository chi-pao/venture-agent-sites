<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>プロジェクト管理ツール</title>
    <style>
        body { font-family: Arial, sans-serif; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        input, textarea { width: 100%; padding: 10px; margin: 10px 0; }
        button { padding: 10px 20px; }
        #result { margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>プロジェクト管理ツール</h1>
        <form id="projectForm">
            <label for="taskName">タスク名:</label>
            <input type="text" id="taskName" required>
            <label for="priority">優先度:</label>
            <input type="number" id="priority" min="1" max="5" required>
            <label for="dueDate">期限:</label>
            <input type="date" id="dueDate" required>
            <button type="submit">追加</button>
        </form>
        <div id="result" style="margin-top: 20px;"></div>
        <button id="downloadCsv">CSVダウンロード</button>
    </div>

    <script>
        document.getElementById('projectForm').addEventListener('submit', function(event) {
            event.preventDefault();
            const taskName = document.getElementById('taskName').value;
            const priority = document.getElementById('priority').value;
            const dueDate = document.getElementById('dueDate').value;

            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<p>タスク名: ' + taskName + '</p><p>優先度: ' + priority + '</p><p>期限: ' + dueDate + '</p>';
                <p>タスク名: ${taskName}</p>
                <p>優先度: ${priority}</p>
                <p>期限: ${dueDate}</p>
            `;

            // ストレージに保存
            localStorage.setItem('tasks', JSON.stringify([
                ...JSON.parse(localStorage.getItem('tasks') || '[]'),
                { taskName, priority, dueDate }
            ]));
        });

        document.getElementById('downloadCsv').addEventListener('click', function() {
            const tasks = JSON.parse(localStorage.getItem('tasks') || '[]');
            const csvContent = 'タスク名,優先度,期限\n';
            tasks.forEach(task => {
                csvContent += `${task.taskName},${task.priority},${task.dueDate}\n`;
            });
            const blob = new Blob([csvContent], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'tasks.csv';
            a.click();
        });
    </script>
</body>
</html>
