<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'M PLUS Rounded 1c','IPAGothic',sans-serif;background:#0f1b2d}
.banner{width:2560px;height:1440px;position:relative;overflow:hidden;
 background:radial-gradient(1200px 700px at 78% 70%,#ff8a3d55,transparent 70%),linear-gradient(160deg,#10213a 0%,#1b2f52 55%,#2a1f3d 100%)}

.steps{position:absolute;right:0;bottom:0;width:1100px;height:1440px}

<div class="banner" id="banner"><div class="dots"></div>

 <path d="M470 900 l9 26 26 9 -26 9 -9 26 -9 -26 -26 -9 26 -9z" opacity=".7"/></g>
</svg>
<div class="safe"><div class="txt">

</div></div>
</div>
