<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}body{width:1080px;height:1920px;overflow:hidden;background:linear-gradient(170deg,#eaf2ff,#ffffff 55%,#fff3ea);font-family:'M PLUS Rounded 1c',sans-serif;color:#0d2b6b}
#r{position:absolute;inset:0}
.blob{position:absolute;border-radius:50%;filter:blur(40px);opacity:.5}
.hd{position:absolute;top:90px;left:0;right:0;text-align:center}
.hd .k{display:inline-block;background:#1f5bff;color:#fff;font-weight:800;font-size:36px;padding:8px 28px;border-radius:40px}
.hd h1{font-family:'Dela Gothic One';font-size:76px;line-height:1.2;margin-top:18px}
.hd h1 span{color:#ff6a2b}
.ph{position:absolute;left:50%;top:400px;width:600px;height:1110px;margin-left:-300px;border-radius:60px;border:14px solid #0d2b6b;background:#fff;overflow:hidden;box-shadow:0 30px 70px rgba(13,43,107,.3)}
.ph img{position:absolute;left:0;top:0;width:100%}
.step{position:absolute;left:40px;top:430px;width:130px;height:130px;border-radius:50%;background:#ff6a2b;color:#fff;font-family:'Dela Gothic One';font-size:70px;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 0 #c44a14;z-index:3}
.sub{position:absolute;left:50px;right:50px;top:1560px;min-height:160px;background:#0d2b6b;color:#fff;border-radius:30px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;font-size:44px;line-height:1.35;padding:16px 28px}
.foot{position:absolute;left:30px;right:30px;bottom:30px;font-size:22px;color:#556;text-align:center;line-height:1.4}
.pill{display:inline-block;background:#ff6a2b;color:#fff;font-family:'Dela Gothic One';font-size:54px;padding:22px 54px;border-radius:80px;box-shadow:0 10px 0 #c44a14}
</style></head><body><div class="blob" style="width:500px;height:500px;background:#7cb4ff;left:-150px;top:600px"></div><div class="blob" style="width:500px;height:500px;background:#ffc199;right:-150px;top:1100px"></div><div id="r"></div>
<script>
let TL;window.setTL=x=>TL=x;const ease=x=>{x=Math.min(1,Math.max(0,x));return x*x*(3-2*x)};const pop=x=>{x=Math.min(1,Math.max(0,x));return 1+Math.sin(x*Math.PI)*.2*(1-x)};
const P='file:///tmp/claude-0/-home-user-venture-agent-sites/68731e5c-3a0a-5d00-8f66-f41a7327d5b4/scratchpad/img/';
const T={n1:'この家、高いのか、安いのか<br>実際に調べてみます',n2:'スクショを貼るか、場所や広さを入れるだけ<br>登録はいりません',n3:'国の取引データをもとにした参考査定価格<br>販売価格との差がひと目で分かる',n4:'同じような家が実際にいくらで<br>売れたかも見られます',n5:'家を買う前の答え合わせに<br>お買い得物件チェッカー（無料）'};
const IMG={n1:'top.png',n2:'c4phone.png',n3:'c5phone.png',n4:'c6phone.png'};const ST={n1:'',n2:'1',n3:'2',n4:'3'};
window.render=t=>{let c=TL.tl[0];for(const x of TL.tl)if(t>=x.t0)c=x;
let h=`<div class="hd"><div class="k">使ってみた</div><h1>その物件、相場と比べて<br><span>高い？安い？</span></h1></div>`;
if(c.n!=='n5'){const i=TL.tl.indexOf(c);const k=ease((t-c.t0)/0.5);const prev=i>0?TL.tl[i-1]:null;
 const base=c.n==='n2'?-120:0;const scroll=base+((c.n==='n1'||c.n==='n2')?0:ease((t-c.t0-1.2)/(c.d))*-100);
 h+=`<div class="ph">`;
 if(prev&&k<1)h+=`<img src="${P}${IMG[prev.n]}" style="opacity:${1-k};transform:translateY(${prev.n==='n2'?-120:prev.n==='n1'?0:-100}px)">`;
 h+=`<img src="${P}${IMG[c.n]}" style="opacity:${k};transform:translateY(${scroll}px)"></div>`;
 if(ST[c.n])h+=`<div class="step" style="transform:scale(${pop((t-c.t0)/0.5)})">${ST[c.n]}</div>`}
else{const s=c.t0;h+=`<div style="position:absolute;left:0;right:0;top:620px;text-align:center;opacity:${ease((t-s)/0.4)}"><div style="font-family:'Dela Gothic One';font-size:72px;line-height:1.3">家を買う前の<br>答え合わせに</div><div style="margin-top:50px;transform:scale(${pop((t-s-0.5)/0.5)})"><div class="pill">お買い得物件チェッカー</div></div><div style="margin-top:34px;font-size:44px;font-weight:800">無料・登録不要 ▶ プロフィールのリンクから</div></div>`}
h+=`<div class="sub" style="opacity:${ease((t-c.t0)/0.2)}">${T[c.n]}</div><div class="foot">画面の物件は架空です（2026年11月3日に実際に計算した結果）。査定は参考値で、売買価格を保証するものではありません。声はAIで作成。</div>`;
document.getElementById('r').innerHTML=h};
</script></body></html>
