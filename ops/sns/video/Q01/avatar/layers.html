<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;font-family:'M PLUS Rounded 1c',sans-serif;background:transparent}
#root{position:absolute;inset:0}
.hdr{position:absolute;top:56px;left:0;right:0;text-align:center}
.badge{display:inline-block;background:#ffd400;color:#1a0b3d;font-family:'Dela Gothic One';font-size:46px;padding:8px 38px;border-radius:60px;transform:rotate(-3deg);box-shadow:0 6px 0 #b38f00}
.q{font-family:'Dela Gothic One';font-size:72px;line-height:1.12;color:#fff;margin-top:16px;text-shadow:0 5px 0 #e6002d,0 0 26px #ff4fa8;white-space:nowrap}
.panel{position:absolute;left:50px;right:50px;top:1335px}
.card{background:#fff;border:6px solid #1a0b3d;border-radius:26px;padding:14px 30px;box-shadow:8px 8px 0 #ffd400;display:flex;align-items:baseline;gap:20px}
.card .p{font-family:'Dela Gothic One';font-size:40px;color:#1a0b3d;white-space:nowrap}
.card .s{font-size:32px;font-weight:800;color:#333;white-space:nowrap}
.choices{display:flex;flex-direction:column;gap:16px;margin-top:20px}
.ch{position:relative;display:flex;align-items:center;background:#fff;border:6px solid #1a0b3d;border-radius:24px;height:112px;font-family:'Dela Gothic One';font-size:62px;color:#1a0b3d;box-shadow:7px 7px 0 #1a0b3d}
.ch b{display:flex;align-items:center;justify-content:center;width:112px;height:100%;color:#fff;font-size:66px;border-right:6px solid #1a0b3d;margin-right:30px;border-radius:18px 0 0 18px}
.c0 b{background:#e6002d}.c1 b{background:#0057e6}.c2 b{background:#00a85a}
.ok{background:#ffd400}
.ok:after{content:"正解！";position:absolute;right:20px;font-size:46px;background:#e6002d;color:#fff;padding:2px 18px;border-radius:16px;transform:rotate(8deg)}
.bars{display:flex;flex-direction:column;gap:22px}
.bar{display:flex;align-items:center;font-weight:800;font-size:42px;color:#fff}
.bar .l{width:210px}
.bar .v{white-space:nowrap;height:104px;background:#fff;color:#1a0b3d;border-radius:0 22px 22px 0;display:flex;align-items:center;justify-content:flex-end;padding-right:22px;font-family:'Dela Gothic One';font-size:44px;overflow:hidden}
.bar.hi .v{background:#ffd400}
.cta{background:#fff;border-radius:36px;padding:34px;text-align:center;border:6px solid #1a0b3d;box-shadow:10px 10px 0 #ffd400}
.cta .a{font-family:'Dela Gothic One';font-size:64px;color:#e6002d}
.cta .b{font-size:42px;font-weight:800;margin-top:10px;color:#1a0b3d}
.pill{display:inline-block;margin-top:18px;background:#e6002d;color:#fff;font-family:'Dela Gothic One';font-size:50px;padding:16px 46px;border-radius:80px}
.foot{position:absolute;left:30px;right:30px;bottom:22px;font-size:22px;color:#cbb8ff;text-align:center;line-height:1.35}
/* fg */
.frame{position:absolute;left:34px;top:294px;width:1012px;height:1012px;border:10px solid #ffd400;border-radius:30px;box-shadow:0 0 40px #ff4fa8,inset 0 0 30px rgba(0,0,0,.5)}
.name{position:absolute;left:60px;top:318px;font-family:'Dela Gothic One';font-size:44px;color:#fff;padding:6px 26px;border-radius:20px;border:4px solid #fff}
.ai{position:absolute;right:62px;top:322px;font-size:26px;font-weight:800;color:#fff;background:rgba(0,0,0,.55);padding:6px 16px;border-radius:14px}
.sub{position:absolute;left:70px;right:70px;top:1150px;min-height:120px;background:rgba(255,255,255,.96);border-radius:28px;border:6px solid #1a0b3d;display:flex;align-items:center;justify-content:center;padding:10px 30px;font-weight:800;color:#1a0b3d;text-align:center;line-height:1.25}
.timer{position:absolute;left:50%;top:640px;transform:translate(-50%,0);width:300px;height:300px;border-radius:50%;background:rgba(230,0,45,.92);color:#fff;font-family:'Dela Gothic One';font-size:200px;display:flex;align-items:center;justify-content:center;border:12px solid #fff;box-shadow:0 0 60px #ff4fa8}
</style></head><body><div id="root"></div>
<script>
const COL={host:'#7b2ff7',kenji:'#23336b',miho:'#e8552f',sota:'#d9a400',hana:'#e0559a'};
const NAME={host:'司会',kenji:'ケンジ',miho:'ミホ',sota:'ソウタ',hana:'ハナ'};
const Q1=['980万円','1,800万円','2,900万円'],Q2=['東京都','神奈川県','大阪府'];
const HDR={q1:['値段クイズ 第1問','この家、いくらで売れた？'],a1:['第1問 正解','B 1,800万円！'],q2:['第2問','いちばん高いのは？'],a2:['第2問 正解','神奈川県！'],end:['何問 正解できた？','コメントで教えて！']};
let TL=[];window.setTL=x=>{TL=x};
const ease=x=>1-Math.pow(1-Math.min(1,Math.max(0,x)),3);
function seg(t){let s=TL[0];for(const x of TL)if(t>=x.t0)s=x;return s}
function panelStart(t,p){let st=0;for(const x of TL){if(x.t0>t)break;if(x.panel!==p)st=null;else if(st===null||st===0&&x===TL[0])st=x.t0}return st??0}
function choices(list,ans,t,t0){return '<div class="choices">'+list.map((c,i)=>{const k=ease((t-t0-0.12*i)/0.35);return `<div class="ch c${i} ${ans===i?'ok':''}" style="transform:translateX(${(1-k)*1100}px) ${ans===i?'scale('+(1+0.06*Math.max(0,Math.sin((t)*6)))+')':''};opacity:${ans!=null&&ans!==i?.3:1}"><b>${'ABC'[i]}</b>${c}</div>`}).join('')+'</div>'}
function bg(t,s){
 let g=`<svg width="1080" height="1920" style="position:absolute;inset:0"><defs><linearGradient id="bgg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a0f6b"/><stop offset=".55" stop-color="#1a0b3d"/><stop offset="1" stop-color="#12082b"/></linearGradient>
 <radialGradient id="sp" cx="50%" cy="0%" r="90%"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs><rect width="1080" height="1920" fill="url(#bgg)"/>`;
 for(let i=0;i<18;i++){const a=(i/18)*Math.PI*2+t*.12;g+=`<path d="M540 800 L${540+1600*Math.cos(a)} ${800+1600*Math.sin(a)} L${540+1600*Math.cos(a+.12)} ${800+1600*Math.sin(a+.12)}Z" fill="#fff" opacity=".04"/>`}
 [200,540,880].forEach((x,i)=>{const sw=Math.sin(t*1.1+i*2)*160;g+=`<path d="M${x} 0 L${x+sw-200} 1320 L${x+sw+200} 1320Z" fill="url(#sp)"/>`});
 for(let i=0;i<22;i++){const on=(Math.floor(t*5)+i)%3===0;g+=`<circle cx="${30+i*49}" cy="1322" r="8" fill="${on?'#ffd400':'#5b3ba5'}"/>`}
 g+='</svg>';
 const h=HDR[s.panel]||['',''];const ps=panelStart(t,s.panel);const k=ease((t-ps)/0.4);
 g+=`<div class="hdr" style="transform:translateY(${(1-k)*-40}px);opacity:${k}"><div class="badge">${h[0]}</div><div class="q">${h[1]}</div></div>`;
 let p='';
 if(s.panel==='q1'||s.panel==='a1')p=`<div class="card"><div class="p">🏠 群馬県の戸建て</div><div class="s">築10〜17年・建物110㎡・土地200㎡</div></div>`+choices(Q1,s.panel==='a1'?1:null,t,panelStart(t,'q1')||ps);
 else if(s.panel==='q2')p=`<div class="card"><div class="p">🏠 同じような家</div><div class="s">築10〜17年・建物110㎡・土地200㎡</div></div>`+choices(Q2,null,t,ps);
 else if(s.panel==='a2'){const d=[['神奈川県',4400],['東京都',4100],['大阪府',2700],['群馬県',1800]];p='<div class="bars">'+d.map((x,i)=>{const kk=ease((t-ps-0.1*i)/0.6);return `<div class="bar ${i?'':'hi'}"><div class="l">${x[0]}</div><div class="v" style="width:${(200+x[1]/4400*520)*kk}px;${kk<.95?'color:transparent':''}">${x[1].toLocaleString()}万円</div></div>`}).join('')+'</div>'}
 else if(s.panel==='end'){p=`<div class="cta" style="transform:scale(${0.6+0.4*k})"><div class="a">気になる家の値段</div><div class="b">相場と比べて、高い？安い？</div><div class="pill">無料でチェック ▶</div><div class="b" style="font-size:34px">お買い得物件チェッカー</div></div>`}
 g+=`<div class="panel">${p}</div>`;
 g+=`<div class="foot">国の不動産取引データ（2024〜2025年）より。築10〜17年・建物100〜120㎡・土地150〜250㎡の戸建ての取引価格の真ん中の値。登場人物・声はAIで作成した架空のものです。</div>`;
 return g;
}
function fg(t,s){
 let g=`<div class="frame"></div><div class="ai">AIで作成</div>`;
 if(s.who){g+=`<div class="name" style="background:${COL[s.who]}">${NAME[s.who]}</div>`}
 if(s.text){const k=ease((t-s.t0)/0.25);g+=`<div class="sub" style="font-size:${s.text.length>22?42:54}px;transform:translateY(${(1-k)*30}px);opacity:${k}">${s.text}</div>`}
 if(s.count){const k=(t-s.t0)/0.8;g+=`<div class="timer" style="transform:translate(-50%,0) scale(${1.4-0.4*ease(k*3)})">${s.count}</div>`}
 if(s.confetti){const k=t-s.t0;let c='<svg width="1080" height="1920" style="position:absolute;inset:0">';for(let i=0;i<70;i++){const x=(i*97)%1080,y=((i*53)%500)-300+k*600*(0.6+(i%5)/5);const col=['#ffd400','#e6002d','#00c2ff','#00d27a','#ff4fa8'][i%5];c+=`<rect x="${x}" y="${y}" width="18" height="28" fill="${col}" transform="rotate(${i*40+k*300} ${x} ${y})"/>`}g+=c+'</svg>'}
 return g;
}
window.render=(t,layer)=>{const s=seg(t);document.getElementById('root').innerHTML=layer==='bg'?bg(t,s):fg(t,s)};
</script></body></html>
