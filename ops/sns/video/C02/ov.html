<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800&family=Source+Code+Pro:wght@500&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}body{width:1080px;height:1920px;overflow:hidden;background:transparent;font-family:'M PLUS Rounded 1c',sans-serif;color:#fff}
#r{position:absolute;inset:0}
.top{position:absolute;top:60px;left:0;right:0;text-align:center;z-index:5}
.tag{display:inline-block;border:4px solid #29e7ff;font-weight:800;font-size:34px;padding:8px 30px;border-radius:60px;box-shadow:0 0 20px #29e7ff;background:rgba(5,6,15,.6)}
.ttl{font-family:'Dela Gothic One';font-size:76px;margin-top:16px;text-shadow:0 0 12px #fff,0 0 34px #ff4fd8}
.eng{position:absolute;left:80px;right:80px;top:330px;font-family:'Source Code Pro',monospace;font-size:34px;line-height:1.5;color:#7dff9b;text-shadow:0 0 10px #2bff6a;z-index:4}
.jp{position:absolute;left:80px;right:80px;top:330px;font-size:40px;line-height:1.5;font-weight:800;color:#fff;text-shadow:0 0 10px #29e7ff;z-index:4}
.big{position:absolute;left:0;right:0;text-align:center;font-family:'Dela Gothic One';z-index:6}
.cnt{position:absolute;right:60px;top:300px;background:#ff3b5c;font-family:'Dela Gothic One';font-size:40px;padding:6px 22px;border-radius:16px;z-index:6;transform:rotate(6deg)}
.sub{position:absolute;left:60px;right:60px;top:1520px;min-height:140px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;font-size:50px;line-height:1.3;padding:14px 28px;background:rgba(5,6,20,.8);border:4px solid rgba(255,255,255,.25);border-radius:30px;z-index:6}
.who{position:absolute;left:80px;top:1490px;font-size:30px;font-weight:800;padding:4px 18px;border-radius:14px;z-index:7}
.ai{position:absolute;right:30px;bottom:30px;font-size:22px;color:#9aa6d9;z-index:7}
</style></head><body><div id="r"></div>
<script>
let TL;window.setTL=x=>TL=x;const ease=x=>{x=Math.min(1,Math.max(0,x));return x*x*(3-2*x)};const pop=x=>{x=Math.min(1,Math.max(0,x));return 1+Math.sin(x*Math.PI)*.25*(1-x)};
const INK='#3a2418',SK='#ffd7bd';
function baby(ex,t){
 const blink=(ex!=='tired'&&ex!=='happy'&&(t%3.2)<0.12);const by=Math.sin(t*2.2)*6;
 let g=`<g transform="translate(540,${960+by})">`;
 // body (navy) + bib
 g+=`<path d="M-330 620 Q-320 300 0 290 Q320 300 330 620 Z" fill="#23336b"/><path d="M-150 300 Q0 470 150 300 Q0 360 -150 300Z" fill="#fff" opacity=".95"/>`;
 // head
 g+=`<ellipse cx="0" cy="-40" rx="330" ry="315" fill="${SK}" stroke="${INK}" stroke-width="6"/>`;
 g+=`<ellipse cx="-330" cy="-20" rx="48" ry="70" fill="${SK}" stroke="${INK}" stroke-width="6"/><ellipse cx="330" cy="-20" rx="48" ry="70" fill="${SK}" stroke="${INK}" stroke-width="6"/>`;
 // hair tuft
 g+=`<path d="M-20 -350 Q-60 -440 10 -420 Q-10 -470 60 -430 Q40 -380 20 -352" fill="#4a2f1f" stroke="${INK}" stroke-width="5"/>`;
 // cheeks
 const ck=ex==='angry'?'#ff5a5a':'#ff9aa8';g+=`<ellipse cx="-190" cy="80" rx="70" ry="45" fill="${ck}" opacity="${ex==='angry'?.75:.55}"/><ellipse cx="190" cy="80" rx="70" ry="45" fill="${ck}" opacity="${ex==='angry'?.75:.55}"/>`;
 // eyes
 const E=(x)=>{if(blink)return `<path d="M${x-45} -30 q45 18 90 0" stroke="${INK}" stroke-width="10" fill="none" stroke-linecap="round"/>`;
  if(ex==='surprised')return `<circle cx="${x}" cy="-40" r="62" fill="#fff" stroke="${INK}" stroke-width="7"/><circle cx="${x}" cy="-40" r="26" fill="${INK}"/><circle cx="${x+10}" cy="-50" r="9" fill="#fff"/>`;
  if(ex==='tired')return `<path d="M${x-55} -40 h110" stroke="${INK}" stroke-width="12" stroke-linecap="round"/><path d="M${x-50} -40 q50 34 100 0" fill="${INK}"/>`;
  if(ex==='happy')return `<path d="M${x-50} -30 q50 -50 100 0" stroke="${INK}" stroke-width="12" fill="none" stroke-linecap="round"/>`;
  return `<ellipse cx="${x}" cy="-40" rx="40" ry="50" fill="${INK}"/><circle cx="${x+12}" cy="-58" r="12" fill="#fff"/>`};
 g+=E(-125)+E(125);
 // brows
 if(ex==='angry')g+=`<path d="M-190 -140 L-70 -95" stroke="${INK}" stroke-width="16" stroke-linecap="round"/><path d="M190 -140 L70 -95" stroke="${INK}" stroke-width="16" stroke-linecap="round"/>`;
 else if(ex==='surprised')g+=`<path d="M-180 -150 q55 -40 110 -10" stroke="${INK}" stroke-width="12" fill="none" stroke-linecap="round"/><path d="M180 -150 q-55 -40 -110 -10" stroke="${INK}" stroke-width="12" fill="none" stroke-linecap="round"/>`;
 else if(ex==='tired')g+=`<path d="M-180 -110 h100" stroke="${INK}" stroke-width="10" stroke-linecap="round"/><path d="M180 -110 h-100" stroke="${INK}" stroke-width="10" stroke-linecap="round"/>`;
 // mouth
 if(ex==='surprised')g+=`<ellipse cx="0" cy="130" rx="38" ry="52" fill="#7a1f2b"/>`;
 else if(ex==='angry')g+=`<path d="M-55 150 q55 -40 110 0" stroke="${INK}" stroke-width="12" fill="none" stroke-linecap="round"/>`;
 else if(ex==='tired')g+=`<path d="M-45 140 h90" stroke="${INK}" stroke-width="10" stroke-linecap="round"/>`;
 else if(ex==='happy')g+=`<path d="M-70 110 q70 80 140 0 z" fill="#7a1f2b"/>`;
 else g+=`<path d="M-30 130 q30 18 60 0" stroke="${INK}" stroke-width="9" fill="none" stroke-linecap="round"/>`;
 // sweat / anger mark / sigh
 if(ex==='surprised')g+=`<path d="M250 -230 q22 40 0 60 q-22 -20 0 -60z" fill="#7cd3ff" stroke="${INK}" stroke-width="4"/>`;
 if(ex==='angry')g+=`<g transform="translate(230,-260) scale(${1+0.08*Math.sin(t*12)})" stroke="#ff3b5c" stroke-width="14" stroke-linecap="round"><path d="M-30 -10 q20 0 20 -20"/><path d="M30 -10 q-20 0 -20 -20"/><path d="M-30 10 q20 0 20 20"/><path d="M30 10 q-20 0 -20 20"/></g>`;
 g+='</g>';
 // screen glow light from below + laptop edge
 const tint=ex==='angry'?'255,80,90':'90,170,255';
 g+=`<rect x="0" y="1260" width="1080" height="660" fill="url(#lap)"/><rect x="140" y="1420" width="800" height="26" rx="10" fill="#9fb2d6"/>`;
 return `<svg width="1080" height="1920" style="position:absolute;inset:0"><defs><radialGradient id="bg" cx="50%" cy="45%" r="70%"><stop offset="0" stop-color="#172042"/><stop offset="1" stop-color="#05060f"/></radialGradient>
 <linearGradient id="lap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a2240" stop-opacity="0"/><stop offset=".4" stop-color="#111a33"/><stop offset="1" stop-color="#0a0f20"/></linearGradient>
 <radialGradient id="glow" cx="50%" cy="80%" r="60%"><stop offset="0" stop-color="rgb(${tint})" stop-opacity=".45"/><stop offset="1" stop-color="rgb(${tint})" stop-opacity="0"/></radialGradient></defs>
 <rect width="1080" height="1920" fill="url(#bg)"/><rect width="1080" height="1920" fill="url(#glow)"/>${g}</svg>`}
const ENG=['> Task completed successfully.','> Updated 12 files and ran tests.','> All checks passed. Deployed.','> Next: please review the PR.'];
const st=n=>TL.tl.find(x=>x.n===n).t0;
window.render=t=>{let c=TL.tl[0];for(const x of TL.tl)if(t>=x.t0)c=x;
 let h=`<div style="position:absolute;left:0;right:0;top:0;height:330px;background:linear-gradient(rgba(5,6,15,.85),rgba(5,6,15,0));z-index:3"></div><div style="position:absolute;left:0;right:0;bottom:0;height:560px;background:linear-gradient(rgba(5,6,15,0),rgba(5,6,15,.8));z-index:3"></div><div class="top"><div class="tag">バツイチ48歳のAI挑戦記</div><div class="ttl">AIの報告が、全部英語</div></div>`;
 const round={c1:1,c2:1,c3:2,c4:3}[c.scene];
 if(round){const s={1:0,2:st('v3')-0.2,3:st('v5')-0.4}[round];const n=Math.floor((t-s)*5);h+=`<div class="eng">${ENG.slice(0,Math.max(0,Math.min(n,4))).join('<br>')}</div>`;
  if(c.scene!=='c1')h+=`<div class="cnt" style="transform:rotate(6deg) scale(${pop((t-s)/0.4)})">${round}回目</div>`}
 if(c.scene==='c5'){const s=st('v6');h+=`<div class="jp" style="opacity:${ease((t-s-1.2)/0.4)}">> 作業が終わりました。<br>> 12個のファイルを直しました。</div>`}
 if(c.n==='v1')h+=`<div class="big" style="top:1180px;font-size:120px;color:#ffe14d;transform:scale(${pop((t-c.t0)/0.4)})">え？</div>`;
 if(c.n==='v3')h+=`<div class="big" style="top:1170px;font-size:110px;color:#ff3b5c;transform:rotate(-6deg) scale(${pop((t-c.t0)/0.4)})">日本語で！！</div>`;
 if(c.n==='v5')h+=`<div class="big" style="top:1170px;font-size:110px;color:#9fb2d6;opacity:${ease((t-c.t0-0.6)/0.4)}">……読めない</div>`;
 if(c.scene==='c6'){const s=st('v7');h+=`<div style="position:absolute;inset:0;background:rgba(5,6,15,${0.75*ease((t-s)/0.5)});z-index:6"></div><div class="big" style="top:760px;font-size:88px;line-height:1.35;text-shadow:0 0 12px #fff,0 0 34px #ff4fd8;opacity:${ease((t-s)/0.5)}">AI初心者の<br>挑戦は、続く……</div><div class="big" style="top:1110px;font-size:42px;font-family:'M PLUS Rounded 1c';font-weight:800;color:#29e7ff;opacity:${ease((t-s-1.2)/0.4)}">チャンネル登録で、続きを見てね</div>`}
 if(c.who&&c.scene!=='c6'){const ai=c.who==='ai';h+=`<div class="who" style="background:${ai?'#10a37f':'#29e7ff'};color:${ai?'#fff':'#05060f'}">${ai?'AI':'のぼる（心の声）'}</div><div class="sub" style="opacity:${ease((t-c.t0)/0.2)}">${c.text}</div>`}
 h+=`<div class="ai">声：AI（AivisSpeech）／画面は再現したイメージ</div>`;
 document.getElementById('r').innerHTML=h};
</script></body></html>
