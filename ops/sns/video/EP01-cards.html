<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;font-family:"Noto Sans CJK JP","IPAPGothic",sans-serif}
.c{width:1080px;height:1920px;position:relative;overflow:hidden;background:#10172a}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.blur{filter:blur(28px) brightness(.55);transform:scale(1.15)}
.cap{position:absolute;left:60px;right:60px;bottom:250px;background:#0b1020e6;color:#fff;border-radius:36px;padding:44px 50px;font-size:74px;font-weight:900;line-height:1.3;text-align:center}
.cap em{font-style:normal;color:#ffd166}
.sub{display:block;margin-top:18px;font-size:40px;font-weight:700;color:#cfd8ea}
.tag{position:absolute;top:150px;left:60px;background:#fff;color:#14233b;font-size:56px;font-weight:800;padding:20px 38px;border-radius:24px;box-shadow:0 10px 30px #0006}
.tag b{color:#e8590c}
.phone{position:absolute;left:50%;top:150px;transform:translateX(-50%);width:640px;height:1300px;border-radius:70px;background:#000;padding:22px;box-sizing:border-box;box-shadow:0 30px 80px #000a}
.phone img{width:100%;height:100%;object-fit:cover;object-position:top;border-radius:52px}
.phone + .cap{bottom:120px}
.end{background:radial-gradient(110% 80% at 50% 35%,#2a1450 0%,#120a24 60%,#0a0614 100%)}
.end img{position:absolute;left:50%;top:180px;transform:translateX(-50%);width:820px;-webkit-mask-image:radial-gradient(closest-side,#000 75%,transparent 100%)}
.end .cap{background:none;bottom:520px;color:#f3eaff;text-shadow:0 0 30px #ad6dff}
.brand{position:absolute;left:0;right:0;bottom:230px;text-align:center;color:#fff}
.brand b{display:block;font-size:68px}.brand span{display:block;font-size:42px;color:#ecc7ff;margin-top:14px}
</style></head><body>
<div class="c" id="c1"><img class="bg" src="s1.png"><div class="tag">中古戸建て <b>2,480万円</b></div><div class="cap">この家、<br><em>高いの？安いの？</em></div></div>
<div class="c" id="c2"><img class="bg" src="s2.webp"><div class="cap">きっかけは、<br>子どもたちの成長</div></div>
<div class="c" id="c3"><img class="bg" src="s3.webp"><div class="cap">無理なく払えるのは、<br><em>いくらまで？</em></div></div>
<div class="c" id="c4"><img class="bg blur" src="s3.webp"><div class="phone"><img src="ep-input.png" style="object-position:0 62%"></div><div class="cap">条件を入れるだけ<span class="sub">無料・登録なし</span></div></div>
<div class="c" id="c5"><img class="bg blur" src="s3.webp"><div class="phone"><img src="ep-result.png"></div><div class="cap">参考査定 2,011万円<br><em>割高の可能性？</em><span class="sub">※架空の物件で、実際に計算した結果</span></div></div>
<div class="c" id="c6"><img class="bg blur" src="s3.webp"><div class="phone"><img src="ep-band.png"></div><div class="cap">でも、同じような家の<br><em>相場の範囲内</em><span class="sub">4軒のうち2軒がこの価格帯</span></div></div>
<div class="c" id="c7"><img class="bg" src="s7.webp"><div class="cap">数字があると、<br>家族で話しやすい<span class="sub">あとは現地で確かめよう</span></div></div>
<div class="c end" id="c8"><img src="glow-logo.png"><div class="cap">見えなかった相場に、<br>光を当てる。</div><div class="brand"><b>お買い得物件チェッカー</b><span>無料・登録なし｜プロフィールのリンクから</span></div></div>
</body></html>
