<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学習計画作成支援アプリ</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .container {
            max-width: 600px;
            margin: auto;
        }
        input, textarea, select {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
        }
        button {
            padding: 10px 20px;
            cursor: pointer;
        }
        #result {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ddd;
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>学習計画作成支援アプリ</h1>
        <form id="inputForm">
            <label for="subject">科目:</label>
            <input type="text" id="subject" required>
            <label for="goal">学習目標:</label>
            <input type="text" id="goal" required>
            <label for="currentLevel">現在の学習レベル:</label>
            <select id="currentLevel" required>
                <option value="初級">初級</option>
                <option value="中級">中級</option>
                <option value="上級">上級</option>
            </select>
            <label for="time">予定する学習時間（分）:</label>
            <input type="number" id="time" required>
            <button type="button" onclick="calculatePlan()">学習計画を作成</button>
        </form>
        <div id="result" readonly></div>
    </div>

    <script>
        function calculatePlan() {
            const subject = document.getElementById('subject').value;
            const goal = document.getElementById('goal').value;
            const currentLevel = document.getElementById('currentLevel').value;
            const time = document.getElementById('time').value;

            const result = `科目: ${subject}\n学習目標: ${goal}\n現在の学習レベル: ${currentLevel}\n予定する学習時間: ${time}分`;
            document.getElementById('result').innerText = result;

            // データをlocalStorageに保存
            localStorage.setItem('learningPlan', result);

            // CSV形式でダウンロード
            const blob = new Blob([result], {type: 'text/csv'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'learning_plan.csv';
            a.click();
        }
    </script>
</body>
</html>
