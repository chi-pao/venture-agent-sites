<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>オンライン英会話レッスンプラットフォーム</title>
    <style>
        body { font-family: Arial, sans-serif; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .input-section { margin-bottom: 20px; }
        .result-section { margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>オンライン英会話レッスンプラットフォーム</h1>
        <div class="input-section">
            <label for="inputText">入力文:</label>
            <textarea id="inputText" rows="4" cols="50"></textarea>
        </div>
        <div class="input-section">
            <label for="inputNumber">数字:</label>
            <input type="number" id="inputNumber" min="0" max="1000">
        </div>
        <button id="processButton">結果を見る</button>
        <div class="result-section" id="resultSection">
            <h2>結果:</h2>
            <p id="resultText"></p>
        </div>
    </div>

    <script>
        document.getElementById('processButton').addEventListener('click', function() {
            const inputText = document.getElementById('inputText').value;
            const inputNumber = document.getElementById('inputNumber').value;
            const resultText = document.getElementById('resultText');

            // 入力値の検証
            if (inputText.trim() === '' || inputNumber === '') {
                resultText.textContent = '入力が不足しています。';
                return;
            }

            // 入力値の加工
            const processedText = inputText.split(' ').map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(' ');
            const processedNumber = parseInt(inputNumber, 10);

            // 結果の表示
            resultText.textContent = `入力文: ${processedText}\n数字: ${processedNumber}`;

            // データの保存
            localStorage.setItem('inputText', inputText);
            localStorage.setItem('inputNumber', inputNumber);

            // CSV出力
            const csvData = `入力文: ${processedText}\n数字: ${processedNumber}\n`;
            const csvBlob = new Blob([csvData], { type: 'text/csv' });
            const csvUrl = URL.createObjectURL(csvBlob);
            const a = document.createElement('a');
            a.href = csvUrl;
            a.download = 'result.csv';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        });
    </script>
</body>
</html>
