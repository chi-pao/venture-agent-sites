<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>会計業務自動化アプリ</title>
    <style>
        body { font-family: Arial, sans-serif; }
        #result { margin-top: 20px; }
    </style>
</head>
<body>
    <h1>会計業務自動化アプリ</h1>
    <form id="inputForm">
        <label for="receiptFile">領収書のアップロード:</label>
        <input type="file" id="receiptFile" accept="image/*" required><br><br>
        <label for="expenseCategory">経費項目:</label>
        <input type="text" id="expenseCategory" required><br><br>
        <button type="button" onclick="processInput()">入力処理</button>
    </form>
    <div id="result"></div>

    <script>
        function processInput() {
            const receiptFile = document.getElementById('receiptFile').files[0];
            const expenseCategory = document.getElementById('expenseCategory').value;
            const resultDiv = document.getElementById('result');

            // 簡易的な処理と結果表示
            resultDiv.innerHTML = `経費項目: ${expenseCategory}<br>処理結果: 領収書がアップロードされました。`;

            // 実際の処理
            if (receiptFile) {
                // 領収書の仮想解析
                const parsedReceipt = {
                    amount: 1000, // 仮想的な金額
                    category: expenseCategory
                };
                resultDiv.innerHTML += `<br>解析結果: 金額 ${parsedReceipt.amount}円, カテゴリー: ${parsedReceipt.category}`;

                // 仮想的な月次報告書生成
                const monthlyReport = `月次報告書: 2023年10月, 金額 ${parsedReceipt.amount}円, カテゴリー: ${parsedReceipt.category}`;
                resultDiv.innerHTML += `<br>月次報告書: ${monthlyReport}`;

                // ローカルストレージに保存
                localStorage.setItem('monthlyReport', monthlyReport);
            }
        }

        // CSV出力
        function downloadCSV() {
            const monthlyReport = localStorage.getItem('monthlyReport');
            if (monthlyReport) {
                const csvData = `月次報告書: ${monthlyReport}`;
                const csvBlob = new Blob([csvData], { type: 'text/csv' });
                const csvUrl = URL.createObjectURL(csvBlob);
                const a = document.createElement('a');
                a.href = csvUrl;
                a.download = 'monthly_report.csv';
                a.click();
            }
        }
    </script>
</body>
</html>
