<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>授業スケジュール管理アプリ</title>
    <style>
        body { font-family: Arial, sans-serif; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        input, textarea { width: 100%; padding: 10px; margin: 10px 0; }
        button { padding: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    </style>
</head>
<body>
    <div class="container">
        <h1>授業スケジュール管理アプリ</h1>
        <form id="scheduleForm">
            <label for="subject">科目:</label>
            <input type="text" id="subject" required><br>

            <label for="date">日付:</label>
            <input type="date" id="date" required><br>

            <label for="time">時間:</label>
            <input type="time" id="time" required><br>

            <label for="teacher">先生:</label>
            <input type="text" id="teacher" required><br>

            <label for="location">場所:</label>
            <input type="text" id="location" required><br>

            <button type="button" onclick="addSchedule()">追加</button>
        </form>

        <h2>スケジュール一覧</h2>
        <table id="scheduleTable">
            <thead>
                <tr>
                    <th>科目</th>
                    <th>日付</th>
                    <th>時間</th>
                    <th>先生</th>
                    <th>場所</th>
                </tr>
            </thead>
            <tbody id="scheduleBody">
                <!-- スケジュールが追加される -->
            </tbody>
        </table>

        <h2>レポート</h2>
        <button type="button" onclick="generateReport()">レポート生成</button>
        <div id="report"></div>
    </div>

    <script>
        const scheduleBody = document.getElementById('scheduleBody');

        function addSchedule() {
            const subject = document.getElementById('subject').value;
            const date = document.getElementById('date').value;
            const time = document.getElementById('time').value;
            const teacher = document.getElementById('teacher').value;
            const location = document.getElementById('location').value;

            const row = `
                <tr>
                    <td>${subject}</td>
                    <td>${date}</td>
                    <td>${time}</td>
                    <td>${teacher}</td>
                    <td>${location}</td>
                </tr>
            `;
            scheduleBody.innerHTML += row;

            // 入力欄をクリア
            document.getElementById('subject').value = '';
            document.getElementById('date').value = '';
            document.getElementById('time').value = '';
            document.getElementById('teacher').value = '';
            document.getElementById('location').value = '';
        }

        function generateReport() {
            const rows = Array.from(scheduleBody.getElementsByTagName('tr')).slice(1);
            const report = rows.map(row => {
                const cells = Array.from(row.getElementsByTagName('td'));
                return `${cells[0].textContent} (${cells[1].textContent} ${cells[2].textContent} ${cells[3].textContent} ${cells[4].textContent})`;
            }).join('\n');

            document.getElementById('report').innerText = report;
        }

        // スケジュールの保存と読み込み
        window.onload = function() {
            const savedSchedules = localStorage.getItem('schedules');
            if (savedSchedules) {
                const schedules = JSON.parse(savedSchedules);
                schedules.forEach(addSchedule);
            }
        };

        document.getElementById('scheduleBody').addEventListener('click', function(event) {
            if (event.target.tagName === 'TR') {
                const row = event.target;
                const cells = Array.from(row.getElementsByTagName('td'));
                const subject = cells[0].textContent;
                const date = cells[1].textContent;
                const time = cells[2].textContent;
                const teacher = cells[3].textContent;
                const location = cells[4].textContent;

                alert(`科目: ${subject}\n日付: ${date}\n時間: ${time}\n先生: ${teacher}\n場所: ${location}`);
            }
        });

        document.getElementById('report').addEventListener('click', function(event) {
            if (event.target.tagName === 'BUTTON') {
                generateReport();
            }
        });

        document.getElementById('scheduleForm').addEventListener('submit', function(event) {
            event.preventDefault();
        });

        document.getElementById('scheduleForm').addEventListener('change', function() {
            addSchedule();
        });

        document.getElementById('scheduleBody').addEventListener('click', function(event) {
            if (event.target.tagName === 'TR') {
                const row = event.target;
                const cells = Array.from(row.getElementsByTagName('td'));
                const subject = cells[0].textContent;
                const date = cells[1].textContent;
                const time = cells[2].textContent;
                const teacher = cells[3].textContent;
                const location = cells[4].textContent;

                alert(`科目: ${subject}\n日付: ${date}\n時間: ${time}\n先生: ${teacher}\n場所: ${location}`);
            }
        });

        document.getElementById('scheduleBody').addEventListener('click', function(event) {
            if (event.target.tagName === 'TR') {
                const row = event.target;
                const cells = Array.from(row.getElementsByTagName('td'));
                const subject = cells[0].textContent;
                const date = cells[1].textContent;
                const time = cells[2].textContent;
                const teacher = cells[3].textContent;
                const location = cells[4].textContent;

                alert(`科目: ${subject}\n日付: ${date}\n時間: ${time}\n先生: ${teacher}\n場所: ${location}`);
            }
        });

        // レポートのCSVダウンロード
        document.getElementById('report').addEventListener('click', function(event) {
            if (event.target.tagName === 'BUTTON') {
                generateReport();
                const report = document.getElementById('report').innerText;
                const blob = new Blob([report], { type: 'text/csv' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'schedule_report.csv';
                a.click();
            }
        });
    </script>
</body>
</html>
