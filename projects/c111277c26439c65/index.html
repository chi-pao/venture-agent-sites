<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家族間連絡管理アプリ</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        input, button {
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>家族間連絡管理アプリ</h1>
        <form id="familyForm">
            <label for="name">名前:</label>
            <input type="text" id="name" required>
            <label for="phone">電話番号:</label>
            <input type="tel" id="phone" required>
            <label for="email">メールアドレス:</label>
            <input type="email" id="email" required>
            <button type="button" id="addContact">連絡先追加</button>
        </form>
        <h2>連絡先一覧</h2>
        <div id="contactList"></div>
        <button id="exportCsv">CSV出力</button>
    </div>

    <script>
        document.getElementById('addContact').addEventListener('click', function() {
            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;
            const email = document.getElementById('email').value;
            const contactList = document.getElementById('contactList');

            const contact = document.createElement('div');
            contact.textContent = `名前: ${name}, 電話番号: ${phone}, メールアドレス: ${email}`;
            contactList.appendChild(contact);

            localStorage.setItem(name, `${phone},${email}`);
        });

        document.getElementById('exportCsv').addEventListener('click', function() {
            const contacts = [];
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                const value = localStorage.getItem(key);
                contacts.push(`${key},${value}`);
            }
            const csvContent = "data:text/csv;charset=utf-8," + contacts.join("\n");
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "contacts.csv");
            document.body.appendChild(link);
            link.click();
        });
    </script>
</body>
</html>
