<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>業務効率化ツール</title>
    <style>
        body { font-family: Arial, sans-serif; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        input, button { width: 100%; padding: 10px; margin: 10px 0; }
        #result { margin-top: 20px; padding: 10px; border: 1px solid #ddd; }
    </style>
</head>
<body>
    <div class="container">
        <h1>業務効率化ツール</h1>
        <form id="efficiencyForm">
            <label for="inputValue">入力値:</label>
            <input type="number" id="inputValue" required>
            <button type="button" id="calculateButton">計算</button>
        </form>
        <div id="result" style="display: none;">結果が表示されます。</div>
        <button type="button" id="exportButton">CSV出力</button>
    </div>
    <script>
        document.getElementById('calculateButton').addEventListener('click', function() {
            const inputValue = document.getElementById('inputValue').value;
            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';
            resultDiv.textContent = `入力値: ${inputValue} の平方は ${inputValue * inputValue} です。`;
            saveData();
        });

        function saveData() {
            const inputValue = document.getElementById('inputValue').value;
            const resultDiv = document.getElementById('result').textContent;
            localStorage.setItem('inputValue', inputValue);
            localStorage.setItem('result', resultDiv);
            alert('データが保存されました。');
        }

        function exportData() {
            const inputValue = localStorage.getItem('inputValue');
            const result = localStorage.getItem('result');
            const csvContent = `データ,結果\n${inputValue},${result}`;
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.setAttribute('download', 'output.csv');
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        document.getElementById('exportButton').addEventListener('click', function() {
            exportData();
        });
    </script>
</body>
</html>
