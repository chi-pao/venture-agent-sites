<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>オンライン会議自動録画・編集ツール</title>
    <style>
        body { font-family: Arial, sans-serif; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        input, button { width: 100%; padding: 10px; margin: 10px 0; }
        #result { margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>オンライン会議自動録画・編集ツール</h1>
        <form id="inputForm">
            <label for="meetingDuration">会議の長さ（分）:</label>
            <input type="number" id="meetingDuration" required>
            <label for="videoQuality">ビデオ品質:</label>
            <select id="videoQuality">
                <option value="low">低</option>
                <option value="medium">中</option>
                <option value="high">高</option>
            </select>
            <label for="trimStart">トリミング開始時間（分）:</label>
            <input type="number" id="trimStart" required>
            <label for="trimEnd">トリミング終了時間（分）:</label>
            <input type="number" id="trimEnd" required>
            <button type="button" onclick="processInput()">結果を見る</button>
        </form>
        <div id="result" style="margin-top: 20px;"></div>
    </div>

    <script>
        function processInput() {
            const duration = document.getElementById('meetingDuration').value;
            const quality = document.getElementById('videoQuality').value;
            const trimStart = document.getElementById('trimStart').value;
            const trimEnd = document.getElementById('trimEnd').value;

            const result = `会議の長さ: ${duration}分\nビデオ品質: ${quality}\nトリミング開始時間: ${trimStart}分\nトリミング終了時間: ${trimEnd}分`;

            document.getElementById('result').innerText = result;

            // データをlocalStorageに保存
            localStorage.setItem('inputData', result);

            // CSV形式でダウンロード
            const csvData = `会議の長さ: ${duration}分,ビデオ品質: ${quality},トリミング開始時間: ${trimStart}分,トリミング終了時間: ${trimEnd}分\n`;
            const blob = new Blob([csvData], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'result.csv';
            a.click();
        }
    </script>
</body>
</html>
