<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学習記録アプリ</title>
    <style>
        body { font-family: Arial, sans-serif; }
        .container { margin: 20px; }
        input, textarea, select { width: 100%; padding: 10px; margin: 10px 0; }
        button { padding: 10px; }
        #result { margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>学習記録アプリ</h1>
        <form id="inputForm">
            <label for="subject">科目:</label>
            <input type="text" id="subject" required>
            <label for="hours">学習時間（分）:</label>
            <input type="number" id="hours" required>
            <label for="date">学習日:</label>
            <input type="date" id="date" required>
            <button type="button" id="submit">記録追加</button>
        </form>
        <div id="result"></div>
    </div>

    <script>
        document.getElementById('submit').addEventListener('click', function() {
            const subject = document.getElementById('subject').value;
            const hours = document.getElementById('hours').value;
            const date = document.getElementById('date').value;

            const result = `科目: ${subject}, 学習時間: ${hours}分, 学習日: ${date}`;
            document.getElementById('result').innerText = result;
            localStorage.setItem('record', result);
        });

        window.onload = function() {
            const storedRecord = localStorage.getItem('record');
            if (storedRecord) {
                document.getElementById('result').innerText = storedRecord;
            }
        };
    </script>
</body>
</html>
