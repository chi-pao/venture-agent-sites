<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>友人間旅行計画アプリ</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        h1 {
            text-align: center;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        label, input, button {
            display: block;
            margin-bottom: 10px;
        }
        .result {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ddd;
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>友人間旅行計画アプリ</h1>
        <form id="travelForm">
            <label for="destination">目的地:</label>
            <input type="text" id="destination" required>
            
            <label for="budget">予算 (円):</label>
            <input type="number" id="budget" required>
            
            <label for="numPeople">人数:</label>
            <input type="number" id="numPeople" required>
            
            <button type="button" id="calculateButton">計算</button>
        </form>
        <div class="result" id="result"></div>
    </div>

    <script>
        document.getElementById('calculateButton').addEventListener('click', function() {
            const destination = document.getElementById('destination').value;
            const budget = document.getElementById('budget').value;
            const numPeople = document.getElementById('numPeople').value;
            
            const result = `目的地: ${destination}<br>予算: ${budget}円<br>人数: ${numPeople}人`;
            
            document.getElementById('result').innerText = result;
            
            // 保存処理
            localStorage.setItem('travelPlan', result);
            
            // CSV出力
            const csvData = `目的地,予算,人数\n${destination},${budget},${numPeople}`;
            const blob = new Blob([csvData], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = '旅行計画.csv';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        });
    </script>
</body>
</html>
