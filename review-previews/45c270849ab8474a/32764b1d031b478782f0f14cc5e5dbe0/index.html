    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>業務効率化ツール</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
        }
        button {
            padding: 10px 20px;
            cursor: pointer;
        }
        #result {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ddd;
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>業務効率化ツール</h1>
        <form id="inputForm">
            <label for="inputValue">入力値:</label>
            <input type="number" id="inputValue" min="1" required>
            <button type="button" id="calculateButton">計算</button>
        </form>
        <div id="result"></div>
    </div>
    <script>
        document.getElementById('calculateButton').addEventListener('click', function() {
            const inputValue = document.getElementById('inputValue').value;
            const resultDiv = document.getElementById('result');
            resultDiv.textContent = `計算結果: ${inputValue * 2}`;

            // データをlocalStorageに保存
            localStorage.setItem('lastInput', inputValue);
            localStorage.setItem('lastResult', resultDiv.textContent);

            // CSV形式でダウンロード
            const csvData = `入力値,計算結果\n${inputValue},${resultDiv.textContent}`;
            const blob = new Blob([csvData], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = '結果.csv';
            link.click();
        });
    </script>
</body>
</html>
