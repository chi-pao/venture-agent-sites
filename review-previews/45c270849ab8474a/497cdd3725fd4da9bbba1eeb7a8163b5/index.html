    <title>業務効率化ツール</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
        .container { width: 100%; max-width: 1280px; margin: 0 auto; padding: 20px; }

        .section { margin-bottom: 20px; }
        .section h2 { margin-top: 0; }

        .result { margin-top: 20px; padding: 10px; background: #f9f9f9; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>業務効率化ツール</h1>
        </header>
        <div class="content">
            <div class="section">
                <h2>対象者・利用場面・得られる結果</h2>
                <p>中小企業の管理者と従業員が、日々の業務を効率化するために使用します。具体的には、予算管理、予定設定、報告書作成などを行います。</p>
            </div>
            <div class="section">
                <h2>3段階の使い方</h2>
                <ol>
                    <li>データの入力</li>
                    <li>結果の確認</li>
                    <li>結果の保存と共有</li>
                </ol>
            </div>
            <div class="section">
                <h2>使い道が伝わるサンプル</h2>
                <p>以下に、架空の予算管理のサンプルを示します。</p>
                <form id="budgetForm">
                    <label for="category">カテゴリ:</label>
                    <input type="text" id="category" name="category" required><br>
                    <label for="amount">金額:</label>
                    <input type="number" id="amount" name="amount" required><br>
                    <label for="date">日付:</label>
                    <input type="date" id="date" name="date" required><br>
                    <button type="button" onclick="calculateBudget()">計算</button>
                    <div class="result" id="result"></div>
                </form>
            </div>
        </div>
    </div>
    <script>
        function calculateBudget() {
            const category = document.getElementById('category').value;
            const amount = document.getElementById('amount').value;
            const date = document.getElementById('date').value;
            const resultDiv = document.getElementById('result');

            // 簡単な計算処理
            const result = `カテゴリ: ${category}, 金額: ${amount}円, 日付: ${date}`;

            resultDiv.innerHTML = result;
        }
    </script>
</body>
