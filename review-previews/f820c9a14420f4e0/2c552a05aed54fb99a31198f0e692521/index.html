    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>顧客エンゲージメントツール</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        h1, h2 { color: #333; }
        input, button { margin: 10px 0; }
        .error { color: red; }
    </style>

<body>
    <div class="container">
        <h1>顧客エンゲージメントツール</h1>
        <h2>対象顧客: 企業</h2>
        <h2>利用場面: 顧客エンゲージメントの計画と実行</h2>
        <h2>得られる結果: 顧客満足度の向上と効果的なコミュニケーション</h2>
        <h2>3段階の使い方:</h2>
        <ol>
            <li>目標設定とターゲット顧客の設定</li>
            <li>個別化されたメッセージ提案</li>
            <li>メッセージの送信と結果の分析</li>
        </ol>
        <form id="form">
            <label for="customerName">顧客名:</label>
            <input type="text" id="customerName" required>
            <br>
            <label for="message">メッセージ:</label>
            <input type="text" id="message" required>
            <br>
            <button type="button" onclick="processInput()">処理</button>
            <div id="result" class="result"></div>
            <button type="button" onclick="saveData()">保存</button>
            <button type="button" onclick="loadData()">復元</button>
            <button type="button" onclick="exportData()">CSV出力</button>
        </form>
        <div id="error" class="error"></div>
    </div>

    <script>
        function processInput() {
            const customerName = document.getElementById('customerName').value;
            const message = document.getElementById('message').value;
            const resultDiv = document.getElementById('result');

            // 假设处理逻辑
            const processedMessage = `処理されたメッセージ: ${message} - 顧客: ${customerName}`;
            resultDiv.textContent = processedMessage;

            // 清除错误信息
            document.getElementById('error').textContent = '';
        }

        function saveData() {
            const customerName = document.getElementById('customerName').value;
            const message = document.getElementById('message').value;
            localStorage.setItem('customerData', JSON.stringify({ customerName, message }));
            alert('データ保存しました。');
        }

        function loadData() {
            const data = localStorage.getItem('customerData');
            if (data) {
                const parsedData = JSON.parse(data);
                document.getElementById('customerName').value = parsedData.customerName;
                document.getElementById('message').value = parsedData.message;
                alert('データ復元しました。');
            } else {
                alert('データが保存されていません。');
            }
        }

        function exportData() {
            const customerName = document.getElementById('customerName').value;
            const message = document.getElementById('message').value;
            const csvData = `顧客名: ${customerName}\nメッセージ: ${message}`;
            const blob = new Blob([csvData], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'customer_data.csv';
            a.click();
        }
    </script>
</body>
</html>
