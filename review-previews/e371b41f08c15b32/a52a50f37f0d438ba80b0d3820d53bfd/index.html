for(const kind of ['localStorage','sessionStorage']){
 const raw=window[kind];
 const keys=()=>{const out=[];for(let i=0;i<raw.length;i++){const k=raw.key(i);if(k&&k.startsWith(prefix))out.push(k.slice(prefix.length));}return out;};
 const methods={getItem:k=>raw.getItem(prefix+String(k)),setItem:(k,v)=>raw.setItem(prefix+String(k),String(v)),removeItem:k=>raw.removeItem(prefix+String(k)),clear:()=>keys().forEach(k=>raw.removeItem(prefix+k)),key:i=>keys()[Number(i)]??null};
 const proxy=new Proxy(Object.create(null),{
  get:(target,key)=>key==='length'?keys().length:key in methods?methods[key]:typeof key==='string'?(raw.getItem(prefix+key)??undefined):undefined,
  set:(target,key,v)=>{raw.setItem(prefix+String(key),String(v));return true;},
  deleteProperty:(target,key)=>{raw.removeItem(prefix+String(key));return true;},
  ownKeys:()=>keys(),getOwnPropertyDescriptor:(target,key)=>keys().includes(key)?{configurable:true,enumerable:true,writable:true,value:raw.getItem(prefix+key)}:undefined
 });
 Object.defineProperty(window,kind,{value:proxy,configurable:true});
}
if(window.indexedDB){
 const raw=window.indexedDB;

  const value=Reflect.get(target,key,target);return typeof value==='function'?value.bind(target):value;

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI駆動型のオンラインマインドフルネス教室</title>
    <style>
        body { font-family: Arial, sans-serif; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { text-align: center; margin-bottom: 20px; }
        .input-group { margin-bottom: 10px; }
        .input-group label { display: block; margin-bottom: 5px; }
        .input-group input { width: 100%; padding: 8px; margin-bottom: 10px; }
        .result { margin-top: 20px; }
        .error { color: red; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>AI駆動型のオンラインマインドフルネス教室</h1>
            <p>ストレス軽減とメンタルヘルス改善</p>
        </div>
        <div class="input-group">
            <label for="stressLevel">ストレスレベル (1-10):</label>
            <input type="number" id="stressLevel" min="1" max="10" required>
        </div>
        <div class="input-group">
            <label for="name">名前:</label>
            <input type="text" id="name" required>
        </div>
        <button onclick="calculateFeedback()">フィードバックを取得</button>
        <div class="result" id="result"></div>
        <div class="error" id="error"></div>
    </div>

    <script>
        async function calculateFeedback() {
            const stressLevel = document.getElementById('stressLevel').value;
            const name = document.getElementById('name').value;
            const resultDiv = document.getElementById('result');
            const errorDiv = document.getElementById('error');

            errorDiv.textContent = '';
            resultDiv.textContent = '';

            if (stressLevel && name) {
                const response = await fetch('/api/feedback', { method: 'POST', body: JSON.stringify({ stressLevel, name }), headers: { 'Content-Type': 'application/json' } });
const feedback = await response.json();
                resultDiv.textContent = feedback.message;
            } else {
                errorDiv.textContent = '名前とストレスレベルを入力してください。';
            }
        }

        // 保存とCSV出力
        const localStorageKey = 'stressFeedback';
        const saveFeedback = async (name, stressLevel) => {
            const response = await fetch('/api/save', { method: 'POST', body: JSON.stringify({ name, stressLevel }), headers: { 'Content-Type': 'application/json' } });
        };

        const loadFeedback = async () => {
            const response = await fetch('/api/load');
const savedData = await response.json();
            if (savedData) {
                const data = JSON.parse(savedData);
                document.getElementById('name').value = savedData.name;
                document.getElementById('stressLevel').value = data.stressLevel;
            }
        };

        const downloadCSV = (data) => {
            const csvContent = `名前,ストレスレベル\n${data.name},${data.stressLevel}`;
            const blob = new Blob([csvContent], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'stress_feedback.csv';
            a.click();
        };

        document.getElementById('stressLevel').addEventListener('input', saveFeedback);
        document.getElementById('name').addEventListener('input', saveFeedback);
        loadFeedback();
    </script>
</body>
</html>
