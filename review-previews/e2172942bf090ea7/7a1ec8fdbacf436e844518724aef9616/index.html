<body>
    <div class="container">
        <h1>プロジェクト管理ツール</h1>
        <p>プロジェクトマネージャー、チームリーダー、プロジェクトメンバーが効率的なプロジェクト管理とチームコラボレーションを達成するために、タスクの自動割り当てと通知から始める利用場面。</p>
        <form id="taskForm">
            <h2>タスクの自動割り当てと通知</h2>
            <label for="taskDetails">タスク詳細:</label>
            <textarea id="taskDetails" name="taskDetails" required></textarea>
            <br>
            <label for="assignees">割り当て先:</label>
            <input type="text" id="assignees" name="assignees" required>
            <br>
            <button type="submit">送信</button>
        </form>
        <div id="result" style="margin-top: 20px;"></div>
    </div>

    <script>
        document.getElementById('taskForm').addEventListener('submit', function(event) {
            event.preventDefault();
            const taskDetails = document.getElementById('taskDetails').value;
            const assignees = document.getElementById('assignees').value;
            const resultDiv = document.getElementById('result');

            // ここではAIエンジンAPIやデータベースサーバーは未接続として処理
            const sampleData = {
                taskDetails: taskDetails,
                assignees: assignees,
                accuracy: "正確な割り当て",
                priority: "優先度が適切",
                collaboration: "コラボレーションがスムーズ"
            };

            resultDiv.innerHTML = `
                <h2>結果</h2>
                <p>タスク詳細: ${sampleData.taskDetails}</p>
                <p>割り当て先: ${sampleData.assignees}</p>
                <p>正確性: ${sampleData.accuracy}</p>
                <p>優先順位: ${sampleData.priority}</p>
                <p>コラボレーション: ${sampleData.collaboration}</p>
            `;

            // 保存機能
            localStorage.setItem('taskData', JSON.stringify(sampleData));
        });
    </script>
</body>
