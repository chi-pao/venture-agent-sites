    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>健康ケアアプリ</title>
    <style>
        body { font-family: Arial, sans-serif; }
        .container { width: 80%; margin: auto; padding: 20px; }
        input, button { margin: 10px 0; }
        #result { margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>健康ケアアプリ</h1>
        <form id="inputForm">
            <label for="steps">歩数 (歩)</label>
            <input type="number" id="steps" min="0" required>
            <label for="heartRate">心拍数 (回/分)</label>
            <input type="number" id="heartRate" min="0" required>
            <label for="sleepHours">睡眠時間 (時間)</label>
            <input type="number" id="sleepHours" min="0" required>
            <button type="button" id="calculate">計算</button>
        </form>
        <div id="result" style="color: green;"></div>
        <button id="downloadCsv">CSVダウンロード</button>
    </div>

    <script>
        document.getElementById('calculate').addEventListener('click', function() {
            const steps = parseInt(document.getElementById('steps').value);
            const heartRate = parseInt(document.getElementById('heartRate').value);
            const sleepHours = parseInt(document.getElementById('sleepHours').value);

            const result = `歩数: ${steps}歩, 心拍数: ${heartRate}回/分, 睡眠時間: ${sleepHours}時間`;

            document.getElementById('result').innerText = result;
            localStorage.setItem('healthData', result);
        });

        document.getElementById('downloadCsv').addEventListener('click', function() {
            const result = localStorage.getItem('healthData');
            if (result) {
                const csvData = `歩数,心拍数,睡眠時間\n${result}`;
                const blob = new Blob([csvData], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.setAttribute('download', 'health_data.csv');
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }
        });
    </script>
</body>
</html>
