    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>健康ケアアプリ</title>
    <style>
        body { font-family: Arial, sans-serif; }
        .container { width: 80%; margin: 0 auto; padding: 20px; }
        input, textarea { width: 100%; padding: 10px; margin: 10px 0; }
        button { padding: 10px 20px; }
        #result { margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>健康ケアアプリ</h1>
        <form id="healthForm">
            <label for="age">年齢:</label>
            <input type="number" id="age" name="age" required>
            <label for="weight">体重(kg):</label>
            <input type="number" id="weight" name="weight" required>
            <label for="height">身長(cm):</label>
            <input type="number" id="height" name="height" required>
            <button type="button" id="calculate">計算</button>
        </form>
        <div id="result" style="margin-top: 20px;"></div>
        <button id="saveData">データ保存</button>
        <a href="#" id="downloadCsv">CSVダウンロード</a>
    </div>

    <script>
        document.getElementById('calculate').addEventListener('click', function() {
            const age = document.getElementById('age').value;
            const weight = document.getElementById('weight').value;
            const height = document.getElementById('height').value;
            const result = `年齢: ${age}, 体重: ${weight}kg, 身長: ${height}cm\nBMI: ${weight / (height / 100) ** 2}`;
            document.getElementById('result').innerText = result;
        });

        document.getElementById('saveData').addEventListener('click', function() {
            const result = document.getElementById('result').innerText;
            localStorage.setItem('healthData', result);
            alert('データが保存されました。');
        });

        document.getElementById('downloadCsv').addEventListener('click', function() {
            const result = localStorage.getItem('healthData');
            const csvContent = 'data:text/csv;charset=utf-8,' + encodeURIComponent(result);
            const link = document.createElement('a');
            link.href = csvContent;
            link.download = 'health_data.csv';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });
    </script>
</body>
</html>
