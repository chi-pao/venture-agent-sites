 const methods={getItem:k=>raw.getItem(prefix+String(k)),setItem:(k,v)=>raw.setItem(prefix+String(k),String(v)),removeItem:k=>raw.removeItem(prefix+String(k)),clear:()=>keys().forEach(k=>raw.removeItem(prefix+k)),key:i=>keys()[Number(i)]??null};

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>オンライン料理教室</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .container {
            max-width: 600px;
            margin: auto;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
        }
        button {
            padding: 10px 20px;
        }
        #result {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ccc;
            min-height: 100px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>オンライン料理教室</h1>
        <form id="recipeForm">
            <label for="ingredient">材料（カンマ区切り）:</label>
            <input type="text" id="ingredient" name="ingredient" required>
            <label for="cookingTime">調理時間（分）:</label>
            <input type="number" id="cookingTime" name="cookingTime" required>
            <button type="button" onclick="calculateRecipe()">レシピ生成</button>
        </form>
        <div id="result"></div>
        <button onclick="downloadCSV()">CSVダウンロード</button>
    </div>

    <script>
        function calculateRecipe() {
            const ingredient = document.getElementById('ingredient').value;
            const cookingTime = document.getElementById('cookingTime').value;
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = `材料: ${ingredient}<br>調理時間: ${cookingTime}分`;
            localStorage.setItem('recipe', resultDiv.innerHTML);
        }

        function downloadCSV() {
            const recipe = localStorage.getItem('recipe');
            if (recipe) {
                const blob = new Blob([recipe], { type: 'text/csv' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'recipe.csv';
                a.click();
                URL.revokeObjectURL(url);
            }
        }
    </script>
</body>
</html>
