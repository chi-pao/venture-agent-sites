    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>データ分析サービス</title>
    <style>
        body { font-family: Arial, sans-serif; }
        #result { margin-top: 20px; }
    </style>
</head>
<body>
    <h1>データ分析サービス</h1>
    <form id="dataForm">
        <label for="inputData">データ入力 (例: 10, 20, 30, 40, 50)</label>
        <input type="text" id="inputData" required>
        <button type="button" onclick="analyzeData()">分析</button>
    </form>
    <div id="result" style="margin-top: 20px;"></div>
    <div id="savedResults" style="margin-top: 20px;"></div>
    <button type="button" onclick="downloadResults()">CSVダウンロード</button>

    <script>
        function analyzeData() {
            const input = document.getElementById('inputData').value;
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '';

            if (input) {
                const numbers = input.split(',').map(Number);
                const sum = numbers.reduce((acc, val) => acc + val, 0);
                const average = sum / numbers.length;

                resultDiv.innerHTML = `合計: ${sum}<br>平均: ${average.toFixed(2)}<br>分析日: ${new Date().toLocaleDateString()}`;
                saveResult(sum, average);
            }
        }

        function saveResult(sum, average) {
            const savedResultsDiv = document.getElementById('savedResults');
            savedResultsDiv.innerHTML = '';

            const result = `合計: ${sum}<br>平均: ${average.toFixed(2)}`;
            savedResultsDiv.innerHTML = result;
            localStorage.setItem('analysisResult', result);
        }

        function downloadResults() {
            const savedResults = localStorage.getItem('analysisResult');
            if (savedResults) {
                const blob = new Blob([savedResults], { type: 'text/csv' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'analysis_results.csv';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }
        }
    </script>
</body>
</html>
