    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>返品対応管理アプリ</title>
    <style>
        body { font-family: Arial, sans-serif; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { text-align: center; margin-bottom: 20px; }
        .input-group { margin-bottom: 10px; }
        .input-group label { display: block; margin-bottom: 5px; }
        .input-group input { width: 100%; padding: 8px; margin-bottom: 10px; }
        .result { margin-top: 20px; }
        .error { color: red; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>返品対応管理アプリ</h1>
            <p>EC運営者向け</p>
        </div>
        <div id="inputForm" class="input-group">
            <label for="returnList">返品一覧</label>
            <input type="text" id="returnList" readonly>
            <label for="approveReturn">返品申請承認</label>
            <input type="text" id="approveReturn" readonly>
            <label for="updateInfo">返品情報更新</label>
            <input type="text" id="updateInfo" readonly>
        </div>
        <div id="result" class="result"></div>
        <button id="saveData">保存</button>
        <button id="exportCsv">CSV出力</button>
        <button id="loadBackup">バックアップ復元</button>
    </div>

    <script>
        document.getElementById('saveData').addEventListener('click', saveData);
        document.getElementById('exportCsv').addEventListener('click', exportCsv);
        document.getElementById('loadBackup').addEventListener('click', loadBackup);

        function saveData() {
            const returnList = document.getElementById('returnList').value;
            const approveReturn = document.getElementById('approveReturn').value;
            const updateInfo = document.getElementById('updateInfo').value;
            localStorage.setItem('returnData', JSON.stringify({ returnList, approveReturn, updateInfo }));
            document.getElementById('result').innerText = 'データ保存しました。';
        }

        function exportCsv() {
            const returnList = document.getElementById('returnList').value;
            const approveReturn = document.getElementById('approveReturn').value;
            const updateInfo = document.getElementById('updateInfo').value;
            const csvContent = `返品一覧,返品申請承認,返品情報更新
${returnList},${approveReturn},${updateInfo}`;
            const blob = new Blob([csvContent], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'return_data.csv';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        function loadBackup() {
            const backupData = localStorage.getItem('returnData');
            if (backupData) {
                const data = JSON.parse(backupData);
                document.getElementById('returnList').value = data.returnList;
                document.getElementById('approveReturn').value = data.approveReturn;
                document.getElementById('updateInfo').value = data.updateInfo;
                document.getElementById('result').innerText = 'バックアップ復元しました。';
            } else {
                document.getElementById('result').innerText = 'バックアップデータが見つかりません。';
            }
        }
    </script>
</body>
</html>
