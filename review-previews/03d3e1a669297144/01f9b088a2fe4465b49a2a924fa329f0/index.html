    <title>健康管理アプリ</title>

        body { font-family: Arial, sans-serif; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }

<body>
    <div class="container">
        <h1>健康管理アプリ</h1>
        <form id="healthForm">
            <label for="age">年齢</label>
            <input type="number" id="age" name="age" required>
            <label for="weight">体重 (kg)</label>
            <input type="number" id="weight" name="weight" required>
            <label for="height">身長 (cm)</label>
            <input type="number" id="height" name="height" required>
            <button type="button" onclick="generatePlan()">健康計画生成</button>
        </form>
        <div id="result" class="result"></div>
        <button id="saveData">データ保存</button>
        <button id="exportCsv">CSV出力</button>
    </div>

    <script>
        function generatePlan() {
            const age = document.getElementById('age').value;
            const weight = document.getElementById('weight').value;
            const height = document.getElementById('height').value;
            const result = document.getElementById('result');

            // 健康計画生成の例
            const plan = `年齢: ${age}歳, 体重: ${weight}kg, 身長: ${height}cm`;
            result.innerHTML = plan;
        }

        function saveData() {
            const data = {
                age: document.getElementById('age').value,
                weight: document.getElementById('weight').value,
                height: document.getElementById('height').value
            };
            localStorage.setItem('healthData', JSON.stringify(data));
            alert('データが保存されました。');
        }

        function exportCsv() {
            const data = JSON.parse(localStorage.getItem('healthData'));
            if (!data) {
                alert('保存されたデータがありません。');
                return;
            }
            const csvContent = `年齢,体重,身長\n${data.age},${data.weight},${data.height}`;
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'health_data.csv';
            link.click();
        }
    </script>
</body>
</html>
