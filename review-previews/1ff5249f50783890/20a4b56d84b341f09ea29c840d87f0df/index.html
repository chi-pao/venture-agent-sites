    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>オンライン会議自動録画・編集ツール</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .container {
            max-width: 600px;
            margin: auto;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
        }
        button {
            padding: 10px 20px;
            cursor: pointer;
        }
        #result {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ccc;
            min-height: 100px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>オンライン会議自動録画・編集ツール</h1>
        <form id="inputForm">
            <label for="meetingDuration">会議時間（分）:</label>
            <input type="number" id="meetingDuration" min="1" required>
            <label for="meetingParticipants">参加者数:</label>
            <input type="number" id="meetingParticipants" min="1" required>
            <label for="audioQuality">音質:</label>
            <select id="audioQuality">
                <option value="low">低</option>
                <option value="medium">中</option>
                <option value="high">高</option>
            </select>
            <button type="button" id="submit">結果を表示</button>
        </form>
        <div id="result"></div>
    </div>
    <script>
        document.getElementById('submit').addEventListener('click', function() {
            const duration = document.getElementById('meetingDuration').value;
            const participants = document.getElementById('meetingParticipants').value;
            const audioQuality = document.getElementById('audioQuality').value;
            const result = `会議時間: ${duration}分, 参加者数: ${participants}人, 音質: ${audioQuality}`;
            document.getElementById('result').innerText = result;
            localStorage.setItem('meetingDetails', result);
            const csvData = `会議時間: ${duration}分, 参加者数: ${participants}人, 音質: ${audioQuality}`;
            const csvBlob = new Blob([csvData], { type: 'text/csv' });
            const csvUrl = URL.createObjectURL(csvBlob);
            const a = document.createElement('a');
            a.href = csvUrl;
            a.download = 'meeting_details.csv';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        });
    </script>
</body>
</html>
