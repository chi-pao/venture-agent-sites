    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>オンライン英会話レッスンプラットフォーム</title>
    <style>
        body { font-family: Arial, sans-serif; }
        .container { width: 80%; margin: 0 auto; padding: 20px; }
        input, textarea { width: 100%; padding: 10px; margin: 10px 0; }
        button { padding: 10px 20px; }
        #result { margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>オンライン英会話レッスンプラットフォーム</h1>
        <form id="form">
            <label for="inputText">入力文字列:</label>
            <textarea id="inputText" rows="4" required></textarea><br>
            <button type="button" id="processButton" onclick="processInput()">結果表示</button>
        </form>
        <div id="result" style="margin-top: 20px;"></div>
    </div>

    <script>
        function processInput() {
            const inputText = document.getElementById('inputText').value;
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '';

            // 入力文字列の長さを表示
            resultDiv.innerHTML += `<p>入力文字列の長さ: ${inputText.length}</p>`;
            // 単語数を計算
            const words = inputText.split(/\s+/).filter(word => word !== '').length;
            resultDiv.innerHTML += `<p>単語数: ${words}</p>`;
            // 文字列を大文字に変換
            const upperCaseText = inputText.toUpperCase();
            resultDiv.innerHTML += `<p>大文字に変換: ${upperCaseText}</p>`;
            // 文字列を小文字に変換
            const lowerCaseText = inputText.toLowerCase();
            resultDiv.innerHTML += `<p>小文字に変換: ${lowerCaseText}</p>`;
        }

        document.getElementById('form').addEventListener('submit', function(event) {
            event.preventDefault();
        });

        function saveToLocal() {
            const inputText = document.getElementById('inputText').value;
            localStorage.setItem('inputText', inputText);
            alert('入力内容がローカルストレージに保存されました。');
        }

        function downloadCSV() {
            const inputText = document.getElementById('inputText').value;
            const csvContent = 'data:text/csv;charset=utf-8,' + encodeURIComponent(inputText);
            const link = document.createElement('a');
            link.href = csvContent;
            link.download = 'input_text.csv';
            link.click();
        }

        document.getElementById('processButton').addEventListener('click', processInput);
        document.getElementById('saveButton').addEventListener('click', saveToLocal);
        document.getElementById('downloadButton').addEventListener('click', downloadCSV);
    </script>
</body>
</html>
