    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音楽理論学習アプリ</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .container {
            max-width: 600px;
            margin: auto;
        }
        .result {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ccc;
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>音楽理論学習アプリ</h1>
        <form id="musicForm">
            <label for="scale">スケールを選択:</label>
            <select id="scale" name="scale">
                <option value="major">大調</option>
                <option value="minor">小調</option>
            </select><br><br>
            <label for="key">キー:</label>
            <input type="number" id="key" name="key" min="1" max="12" required><br><br>
            <button type="button" id="calculate">計算</button>
        </form>
        <div class="result" id="result"></div>
    </div>

    <script>
        document.getElementById('calculate').addEventListener('click', function() {
            const scale = document.getElementById('scale').value;
            const key = parseInt(document.getElementById('key').value, 10);
            const result = calculateMusicTheory(scale, key);
            document.getElementById('result').innerText = result;
        });

        function calculateMusicTheory(scale, key) {
            let result = '';
            if (scale === 'major') {
                result += `大調 ${key} のスケール: `;
                for (let i = 0; i < 7; i++) {
                    const note = (key + i) % 12;
                    result += notes[note] + ' ';
                }
            } else if (scale === 'minor') {
                result += `小調 ${key} のスケール: `;
                for (let i = 0; i < 7; i++) {
                    const note = (key + i) % 12;
                    result += notes[note] + ' ';
                }
            }
            return result;
        }

        const notes = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];

        // データの保存
        document.getElementById('result').addEventListener('click', function() {
            const result = document.getElementById('result').innerText;
            localStorage.setItem('musicTheoryResult', result);
            const csvData = 'スケール結果,' + result + '\n';
            const blob = new Blob([csvData], {type: 'text/csv'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'music_theory_results.csv';
            a.click();
        });
    </script>
</body>
</html>
