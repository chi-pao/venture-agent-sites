    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ビジネスコンサルティングプラットフォーム</title>
    <style>
        body { font-family: Arial, sans-serif; }
        .container { width: 80%; margin: 0 auto; padding: 20px; }
        input, textarea, button { display: block; margin: 10px 0; }
        #result { margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>ビジネスコンサルティングプラットフォーム</h1>
        <form id="consultForm">
            <label for="annualRevenue">年間売上（円）</label>
            <input type="number" id="annualRevenue" required>
            <label for="employees">従業員数</label>
            <input type="number" id="employees" required>
            <button type="button" onclick="calculate()">計算</button>
        </form>
        <div id="result" style="margin-top: 20px;"></div>
        <button onclick="downloadCSV()">CSVダウンロード</button>
    </div>

    <script>
        function calculate() {
            const annualRevenue = document.getElementById('annualRevenue').value;
            const employees = document.getElementById('employees').value;
            const result = (parseInt(annualRevenue) / parseInt(employees)).toLocaleString('ja-JP', { minimumFractionDigits: 2 });

            document.getElementById('result').innerText = `平均年間売上（円）: ${result}`;
        }

        function downloadCSV() {
            const annualRevenue = document.getElementById('annualRevenue').value;
            const employees = document.getElementById('employees').value;
            const result = (parseInt(annualRevenue) / parseInt(employees)).toLocaleString('ja-JP', { minimumFractionDigits: 2 });

            const csvContent = `年間売上,従業員数,平均年間売上（円）
${annualRevenue},${employees},${result}\n`;

            const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'business_analysis.csv';
            link.click();
        }
    </script>
</body>
</html>
