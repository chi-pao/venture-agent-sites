    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音楽理論学習アプリ</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .container {
            max-width: 600px;
            margin: auto;
        }
        input, button {
            margin-top: 10px;
        }
        .result {
            margin-top: 20px;
            font-size: 1.2em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>音楽理論学習アプリ</h1>
        <form>
            <label for="scale">スケールを選択:</label>
            <select id="scale" name="scale">
                <option value="major">大調</option>
                <option value="minor">小調</option>
            </select>
            <br>
            <label for="note">音を選択:</label>
            <select id="note" name="note">
                <option value="C">C</option>
                <option value="D">D</option>
                <option value="E">E</option>
                <option value="F">F</option>
                <option value="G">G</option>
                <option value="A">A</option>
                <option value="B">B</option>
            </select>
            <br>
            <button type="button" id="calculate">計算</button>
        </form>
        <div class="result" id="result"></div>
    </div>

    <script>
        document.getElementById('calculate').addEventListener('click', function() {
            const scale = document.getElementById('scale').value;
            const note = document.getElementById('note').value;
            const result = calculateScaleNote(scale, note);
            document.getElementById('result').innerText = `選択したスケール(${scale})と音(${note})の和音は: ${result}`;
            saveResult(result);
        });

        function calculateScaleNote(scale, note) {
            if (scale === 'major' && note === 'C') return 'C大調';
            if (scale === 'major' && note === 'D') return 'D大調';
            if (scale === 'major' && note === 'E') return 'E大調';
            if (scale === 'major' && note === 'F') return 'F大調';
            if (scale === 'major' && note === 'G') return 'G大調';
            if (scale === 'major' && note === 'A') return 'A大調';
            if (scale === 'major' && note === 'B') return 'B大調';
            if (scale === 'minor' && note === 'C') return 'C小調';
            if (scale === 'minor' && note === 'D') return 'D小調';
            if (scale === 'minor' && note === 'E') return 'E小調';
            if (scale === 'minor' && note === 'F') return 'F小調';
            if (scale === 'minor' && note === 'G') return 'G小調';
            if (scale === 'minor' && note === 'A') return 'A小調';
            if (scale === 'minor' && note === 'B') return 'B小調';
            return '不明';
        }

        function saveResult(result) {
            localStorage.setItem('result', result);
        }

        window.onload = function() {
            const savedResult = localStorage.getItem('result');
            if (savedResult) {
                document.getElementById('result').innerText = savedResult;
            }
        }
    </script>
</body>
</html>
