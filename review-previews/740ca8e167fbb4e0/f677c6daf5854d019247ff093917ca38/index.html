<!doctype html><html lang="ja"><head><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><script>(function(){const prefix="venture_review_4860f5b6325e4efe206afd1a:";
for(const kind of ['localStorage','sessionStorage']){
 const raw=window[kind];
 const keys=()=>{const out=[];for(let i=0;i<raw.length;i++){const k=raw.key(i);if(k&&k.startsWith(prefix))out.push(k.slice(prefix.length));}return out;};
 const methods={getItem:k=>raw.getItem(prefix+String(k)),setItem:(k,v)=>raw.setItem(prefix+String(k),String(v)),removeItem:k=>raw.removeItem(prefix+String(k)),clear:()=>keys().forEach(k=>raw.removeItem(prefix+k)),key:i=>keys()[Number(i)]??null};
 const proxy=new Proxy(Object.create(null),{
  get:(target,key)=>key==='length'?keys().length:key in methods?methods[key]:typeof key==='string'?(raw.getItem(prefix+key)??undefined):undefined,
  set:(target,key,v)=>{raw.setItem(prefix+String(key),String(v));return true;},
  deleteProperty:(target,key)=>{raw.removeItem(prefix+String(key));return true;},
  ownKeys:()=>keys(),getOwnPropertyDescriptor:(target,key)=>keys().includes(key)?{configurable:true,enumerable:true,writable:true,value:raw.getItem(prefix+key)}:undefined
 });
 Object.defineProperty(window,kind,{value:proxy,configurable:true});
}
if(window.indexedDB){
 const raw=window.indexedDB;
 const proxy=new Proxy(raw,{get:(target,key)=>{
  if(key==='open')return (name,...args)=>target.open(prefix+String(name),...args);
  if(key==='deleteDatabase')return name=>target.deleteDatabase(prefix+String(name));
  if(key==='databases'&&target.databases)return async()=>((await target.databases()).filter(d=>d.name&&d.name.startsWith(prefix)).map(d=>({...d,name:d.name.slice(prefix.length)})));
  const value=Reflect.get(target,key,target);return typeof value==='function'?value.bind(target):value;
 }});
 Object.defineProperty(window,'indexedDB',{value:proxy,configurable:true});
}
})();</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>予定整理ボード</title><style>
:root{--accent:#3858a8;--ink:#1d2938;--muted:#68788a;--paper:#f5f8fc;--line:#dce5ef;--card:#fff}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#edf5fb,#f8f7ff 60%,#fff7f0);color:var(--ink);font:16px/1.55 system-ui,"Yu Gothic",sans-serif}.wrap{max-width:1100px;margin:auto;padding:26px 18px 60px}header{background:linear-gradient(120deg,var(--accent),#23384e);color:white;border-radius:24px;padding:32px;box-shadow:0 18px 42px #20364d28}.eyebrow{font-size:13px;letter-spacing:.08em;opacity:.85}h1{font-size:clamp(28px,5vw,42px);line-height:1.2;margin:8px 0 10px}header p{max-width:720px;margin:0;color:#eaf3fb}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0 24px}.step,.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 8px 25px #23384e0d}.step b{color:var(--accent);display:block}.layout{display:grid;grid-template-columns:minmax(280px,.85fr) minmax(0,1.6fr);gap:16px}h2{font-size:20px;margin:0 0 14px}.fields{display:grid;gap:12px}.field span{display:block;font-size:14px;font-weight:700;margin-bottom:5px}input,textarea,select,button{font:inherit}input,textarea,select{width:100%;border:1px solid #cbd7e4;border-radius:11px;padding:10px 12px;min-height:42px;background:#fff;color:var(--ink)}input:focus,textarea:focus,select:focus{outline:3px solid #79a9d344;border-color:var(--accent)}button,.file-button{border:0;border-radius:11px;padding:11px 15px;min-height:42px;background:var(--accent);color:white;font-weight:750;cursor:pointer}button.secondary,.file-button{background:#eaf0f6;color:#26374a}button.danger{background:#fff0ed;color:#a33228}button:hover,.file-button:hover{filter:brightness(.96)}.actions,.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.notice{min-height:26px;color:var(--accent);font-weight:700;margin-top:8px}.metric{display:inline-flex;align-items:baseline;gap:8px;background:#eef4f9;border-radius:12px;padding:10px 13px;margin:0 8px 12px 0}.metric strong{font-size:22px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}table{width:100%;border-collapse:collapse;min-width:620px;background:white}th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}th{background:#f1f5f9;font-size:13px}.row-actions{white-space:nowrap}.row-actions button{min-height:34px;padding:6px 9px;font-size:13px}.muted{color:var(--muted);font-size:13px}.hidden{display:none!important}#restoreFile{display:none}.layout{min-width:0}.layout>.card{min-width:0;width:100%}h1,h2,.field span{overflow-wrap:anywhere}@media(max-width:760px){.wrap{padding:14px 12px 40px;width:100%;min-width:0;overflow-x:hidden}header{padding:23px 20px;border-radius:19px}.steps{grid-template-columns:1fr}.layout{display:flex!important;flex-direction:column;width:100%;min-width:0;gap:12px}.layout>.card{padding:15px;width:100%!important;min-width:0!important;max-width:100%!important;margin:0}.table-wrap{max-width:100%;overflow-x:auto}button,.file-button{min-height:44px}}
</style></head><body><main class="wrap"><header><div class="eyebrow">予定を整理する</div><h1>予定整理ボード</h1><p>個人や小規模チームが予定と期限を登録し、日付順に見通しを整理できます。</p></header><section class="steps" aria-label="使い方"><div class="step"><b>01 入力</b>必要な情報を登録します</div><div class="step"><b>02 整理</b>日付順に予定を整理し、次の予定を確認します。</div><div class="step"><b>03 保存・共有</b>一覧を保存し、CSVで持ち出せます</div></section><div class="layout"><section class="card"><h2>予定を登録</h2><form id="recordForm" class="fields"><label class="field"><span>予定名</span><input id="event_title" type="text" required></label><label class="field"><span>日付</span><input id="event_date" type="date" required></label><label class="field"><span>時刻</span><input id="event_time" type="time"></label><label class="field"><span>メモ</span><textarea id="event_notes" rows="3"></textarea></label><div class="actions"><button id="saveRecord" type="submit">予定を保存</button><button id="clearForm" type="button" class="secondary">入力を消去</button></div></form><div id="result" class="notice" role="status"></div><div class="muted">保存先はこのブラウザです。共有サーバーとは同期しません。</div></section><section class="card"><h2>予定一覧</h2><div class="metric"><span>登録数</span><strong id="recordCount">0</strong></div><div id="summary" class="metric"><span>集計</span><strong id="summaryValue">0</strong></div><label class="field"><span>一覧を検索</span><input id="searchRecords" type="search" placeholder="キーワードを入力"></label><div class="toolbar"><button id="downloadCsv" type="button" class="secondary">CSV出力</button><button id="downloadJson" type="button" class="secondary">バックアップ保存</button><label class="file-button" for="restoreFile">バックアップ復元</label><input id="restoreFile" type="file" accept="application/json,.json"></div><div id="listMessage" class="notice" role="status"></div><div class="table-wrap"><table><thead><tr><th>予定名</th><th>日付</th><th>時刻</th><th>メモ</th><th>操作</th></tr></thead><tbody id="recordRows"></tbody></table></div></section></div></main><script>
const APP={"fields": [{"id": "event_title", "label": "予定名", "type": "text", "role": "title", "required": true, "options": []}, {"id": "event_date", "label": "日付", "type": "date", "role": "date", "required": true, "options": []}, {"id": "event_time", "label": "時刻", "type": "time", "role": "time", "required": false, "options": []}, {"id": "event_notes", "label": "メモ", "type": "textarea", "role": "notes", "required": false, "options": []}], "operation": "schedule", "capabilities": [], "name": "在宅ワーク管理アプリ"};const STORE='venture-records-'+"740ca8e167fb";let records=[];let unresolved=[];let editing=-1;const $=id=>document.getElementById(id);const form=$('recordForm');
function load(){try{const v=JSON.parse(localStorage.getItem(STORE)||'[]');records=Array.isArray(v)?v:(Array.isArray(v.records)?v.records:[]);unresolved=Array.isArray(v.unresolved)?v.unresolved:[]}catch{records=[];unresolved=[]}render()}
function save(){localStorage.setItem(STORE,JSON.stringify(APP.operation==='faq'||APP.capabilities.includes('faq_search')?{records,unresolved}:records));render()}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function reviewDue(row){const d=APP.fields.find(f=>f.role==='date'),r=APP.fields.find(f=>f.role==='rating');if(!row[d?.id])return '学習日を入力';const base=new Date(String(row[d.id])+'T12:00:00');if(Number.isNaN(base.getTime()))return '日付を確認';const score=Number(row[r?.id])||3;base.setDate(base.getDate()+(score<=2?1:score===3?3:7));return base.toLocaleDateString('ja-JP')}
function attendanceSummary(){const f=APP.fields.find(x=>x.role==='status'),n=records.length;const present=records.filter(r=>['出席','遅刻','早退'].includes(r[f?.id])).length;const absent=records.filter(r=>r[f?.id]==='欠席').length;return n?Math.round(present/n*100)+'%（出席扱い'+present+'/'+n+'、欠席'+absent+'）':'—'}
function taskSummary(){const f=APP.fields.find(x=>x.role==='status');const open=records.filter(r=>r[f?.id]!=='完了').length;const overdue=records.filter(r=>taskStatus(r)==='期限超過').length;return open+'件 / 期限超過'+overdue+'件'}
function taskStatus(row){const due=APP.fields.find(f=>f.role==='date'),status=APP.fields.find(f=>f.role==='status');if(row[status?.id]==='完了')return '完了';const date=String(row[due?.id]||'');if(!date)return '期限未設定';const today=new Date();const key=today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');return date<key?'期限超過':date===key?'本日期限':'期限内'}
function meetingStatus(row,index){const d=APP.fields.find(f=>f.role==='date'),t=APP.fields.find(f=>f.role==='time'),m=APP.fields.find(f=>f.role==='duration');const start=new Date(String(row[d?.id]||'')+'T'+String(row[t?.id]||''));if(Number.isNaN(start.getTime()))return '日時を確認';const end=start.getTime()+Math.max(1,Number(row[m?.id])||30)*60000;const conflict=records.some((other,i)=>{if(i===index||other[d?.id]!==row[d?.id])return false;const otherStart=new Date(String(other[d?.id]||'')+'T'+String(other[t?.id]||'')).getTime();const otherEnd=otherStart+Math.max(1,Number(other[m?.id])||30)*60000;return Number.isFinite(otherStart)&&start.getTime()<otherEnd&&otherStart<end});return conflict?'予定が重複':'空き'}
function render(){const q=$('searchRecords').value.trim().toLocaleLowerCase();const source=records.map((r,i)=>({r,i}));if(['schedule','meeting','attendance','task_board','custom_workflow'].includes(APP.operation)){const dateField=APP.fields.find(f=>f.role==='date');if(dateField)source.sort((a,b)=>String(a.r[dateField.id]||'').localeCompare(String(b.r[dateField.id]||'')))}const shown=source.filter(x=>JSON.stringify(x.r).toLocaleLowerCase().includes(q));$('recordRows').innerHTML=shown.map(x=>'<tr>'+APP.fields.map(f=>'<td>'+esc(x.r[f.id])+'</td>').join('')+((APP.operation==='meeting'||APP.capabilities.includes('schedule_conflict'))?'<td>'+meetingStatus(x.r,x.i)+'</td>':'')+((APP.operation==='english_lesson'||APP.capabilities.includes('review_interval'))?'<td>'+reviewDue(x.r)+'</td>':'')+((APP.operation==='task_board'||APP.capabilities.includes('deadline_tracking'))?'<td>'+taskStatus(x.r)+'</td>':'')+'<td class="row-actions"><button type="button" class="secondary" data-edit="'+x.i+'">編集</button> <button type="button" class="danger" data-delete="'+x.i+'">削除</button></td></tr>').join('');$('recordCount').textContent=String(records.length);let value='—';if(APP.operation==='survey'||APP.capabilities.includes('rating_summary')){const nums=records.map(r=>Number(r[APP.fields.find(f=>f.role==='rating')?.id])).filter(Number.isFinite);value=nums.length?(nums.reduce((a,b)=>a+b,0)/nums.length).toFixed(1)+'/5':'—'}else if(APP.operation==='compare'||APP.capabilities.includes('cost_comparison')){const f=APP.fields.find(x=>x.role==='amount');const nums=records.map(r=>Number(r[f?.id])).filter(Number.isFinite);value=nums.length?nums.reduce((a,b)=>a+b,0).toLocaleString():'—'}else if(APP.operation==='faq'||APP.capabilities.includes('faq_search')){value=String(unresolved.length)+'件';if($('unresolvedCount')){$('unresolvedCount').textContent=String(unresolved.length);$('unresolvedList').innerHTML=unresolved.slice(0,20).map(x=>'<li>'+esc(x.question)+'</li>').join('')}}else if(APP.operation==='attendance')value=attendanceSummary();else if(APP.operation==='task_board')value=taskSummary();else if(APP.operation==='custom_workflow'&&APP.capabilities.includes('checklist_progress')){const f=APP.fields.find(x=>x.role==='status');const done=records.filter(r=>['完了','済み','実施済み'].includes(r[f?.id])).length;value=records.length?Math.round(done/records.length*100)+'% 完了':'—'}else if(APP.operation==='custom_workflow'&&APP.capabilities.includes('deadline_tracking')){value=String(records.filter(r=>taskStatus(r)==='期限超過').length)+'件 期限超過'}else if(['schedule','meeting','custom_workflow'].includes(APP.operation))value=records.length?records.length+'件':'—';else value=String(records.length)+'件';$('summaryValue').textContent=value}
form.addEventListener('submit',e=>{e.preventDefault();const row={};for(const f of APP.fields)row[f.id]=$(f.id).value.trim();if(APP.fields.some(f=>f.required&&!row[f.id])){$('result').textContent='必須項目を入力してください';return}if(APP.operation==='faq'&&editing<0){const q=String(row[APP.fields.find(f=>f.role==='question').id]).toLocaleLowerCase();const found=records.find(r=>(String(r[APP.fields.find(f=>f.role==='question').id])+' '+String(r[APP.fields.find(f=>f.role==='answer').id])).toLocaleLowerCase().includes(q));if(found)$('result').textContent='登録済みFAQに一致する回答があります';else $('result').textContent='FAQを登録しました。質問の一致検索を利用できます'}else $('result').textContent=editing<0?'保存しました':'変更を保存しました';if(editing<0)records.unshift(row);else records[editing]=row;editing=-1;form.reset();save()});
$('recordRows').addEventListener('click',e=>{const edit=e.target.dataset.edit,del=e.target.dataset.delete;if(edit!==undefined){editing=Number(edit);const r=records[editing];for(const f of APP.fields)$(f.id).value=r[f.id]??'';$('result').textContent='編集内容を保存してください'}if(del!==undefined){records.splice(Number(del),1);save();$('result').textContent='削除しました'}});
$('clearForm').addEventListener('click',()=>{form.reset();editing=-1;$('result').textContent='入力を消去しました'});$('searchRecords').addEventListener('input',render);
if(APP.operation==='faq'||APP.capabilities.includes('faq_search'))$('searchFaq').addEventListener('click',()=>{const query=$('faqQuery').value.trim();if(!query){$('faqAnswer').textContent='質問を入力してください';return}const qid=APP.fields.find(f=>f.role==='question').id,aid=APP.fields.find(f=>f.role==='answer').id;const hit=records.find(r=>String(r[qid]).toLocaleLowerCase().includes(query.toLocaleLowerCase()));if(hit){$('faqAnswer').textContent=hit[aid]}else{if(!unresolved.some(x=>x.question===query))unresolved.unshift({question:query,created:new Date().toISOString()});$('faqAnswer').textContent='該当する回答がありません。未解決の質問に記録しました。';save()}});
$('downloadCsv').addEventListener('click',()=>{const cell=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const csv='\ufeff'+[APP.fields.map(f=>f.label),...records.map(r=>APP.fields.map(f=>r[f.id]))].map(row=>row.map(cell).join(',')).join('\r\n');download(csv,'text/csv;charset=utf-8','records.csv')});
$('downloadJson').addEventListener('click',()=>download(JSON.stringify({version:1,records,unresolved},null,2),'application/json','records-backup.json'));
function download(data,type,name){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$('restoreFile').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{const v=JSON.parse(await file.text());if(!v||v.version!==1||!Array.isArray(v.records)||v.records.some(r=>!r||typeof r!=='object'||APP.fields.some(f=>typeof r[f.id]!=='string'))||v.unresolved!==undefined&&!Array.isArray(v.unresolved))throw new Error('形式');if(confirm(v.records.length+'件の記録で現在の一覧を置き換えますか？')){records=v.records;unresolved=Array.isArray(v.unresolved)?v.unresolved:[];save();$('listMessage').textContent='バックアップを復元しました'}}catch{$('listMessage').textContent='バックアップを読み込めません。JSON形式を確認してください'}finally{e.target.value=''}});load();
if(APP.capabilities.includes('guided_session')){let remaining=0,timerId=null;const duration=APP.fields.find(f=>f.role==='duration');const display=$('timerDisplay');const draw=()=>{display.textContent=String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(remaining%60).padStart(2,'0')};$('startPractice').addEventListener('click',()=>{if(!remaining)remaining=Math.max(1,Math.min(180,Number($(duration.id).value)||Number(records[0]?.[duration.id])||5))*60;draw();if(timerId)return;timerId=setInterval(()=>{remaining=Math.max(0,remaining-1);draw();if(!remaining){clearInterval(timerId);timerId=null;display.textContent='終了'}} ,1000)});$('pausePractice').addEventListener('click',()=>{clearInterval(timerId);timerId=null});$('resetPractice').addEventListener('click',()=>{clearInterval(timerId);timerId=null;remaining=0;display.textContent='準備完了'})}
</script></body></html>
