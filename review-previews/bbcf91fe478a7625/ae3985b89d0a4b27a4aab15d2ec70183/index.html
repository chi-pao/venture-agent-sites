  deleteProperty:(target,key)=>{raw.removeItem(prefix+String(key));return true;},

 });

}
if(window.indexedDB){
 const raw=window.indexedDB;
 const proxy=new Proxy(raw,{get:(target,key)=>{
  if(key==='open')return (name,...args)=>target.open(prefix+String(name),...args);

    <title>マインドフルネスアプリ</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        #result {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ccc;

        }

</head>
<body>
    <h1>マインドフルネスアプリ</h1>
    <form id="inputForm">
        <label for="stressLevel">ストレスレベル（1-10）:</label>
        <input type="number" id="stressLevel" min="1" max="10" required>
        <button type="button" id="submitBtn">結果を見る</button>
    </form>
    <div id="result"></div>

    <script>
        document.getElementById('submitBtn').addEventListener('click', function() {
            const stressLevel = document.getElementById('stressLevel').value;
            const resultDiv = document.getElementById('result');
            resultDiv.textContent = `ストレスレベル: ${stressLevel} の場合、改善アドバイスは「深呼吸を試してみてください」です。`;
            resultDiv.style.display = 'block';
        });
    </script>
