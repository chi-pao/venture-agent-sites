    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マインドフルネスアプリ</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .input-section {
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .result-section {
            margin-top: 20px;
            text-align: center;
        }
        .result {
            margin: 10px 0;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>マインドフルネスアプリ</h1>
        <div class="input-section">
            <p>ストレスレベルを入力してください (1-10):</p>
            <input type="number" id="stressLevel" min="1" max="10" placeholder="1-10" required>
        </div>
        <button onclick="analyzeStress()">分析</button>
        <div class="result-section" id="resultSection">
            <div class="result" id="result"></div>
        </div>
        <button onclick="saveData()">保存</button>
        <button onclick="exportCSV()">CSV出力</button>
    </div>

    <script>
        function analyzeStress() {
            const stressLevel = document.getElementById('stressLevel').value;
            const resultSection = document.getElementById('resultSection');
            resultSection.innerHTML = '';
            const resultDiv = document.createElement('div');
            resultDiv.className = 'result';
            resultDiv.textContent = `ストレスレベル: ${stressLevel} の場合、提案される練習は「深呼吸」です。`;
            resultSection.appendChild(resultDiv);
        }

        function saveData() {
            const stressLevel = document.getElementById('stressLevel').value;
            localStorage.setItem('stressLevel', stressLevel);
            alert('データが保存されました。');
        }

        function exportCSV() {
            const stressLevel = document.getElementById('stressLevel').value;
            const csvData = `ストレスレベル: ${stressLevel}\n`;
            const blob = new Blob([csvData], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'stress_level.csv';
            link.click();
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
