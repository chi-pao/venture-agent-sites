    <meta charset="UTF-8">

    <title>英会話学習助手</title>
    <style>
        body { font-family: Arial, sans-serif; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { text-align: center; margin-bottom: 20px; }
        .input-group { margin-bottom: 10px; }
        .input-group label { display: block; margin-bottom: 5px; }
        .input-group input { width: 100%; padding: 8px; }
        .result { margin-top: 20px; }
        .error { color: red; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>英会話学習助手</h1>
            <p>個々の学習レベルに合わせた教材を提供します。</p>
        </div>
        <div id="input-group" class="input-group">
            <label for="englishLevel">現在の英語レベル</label>
            <input type="text" id="englishLevel" placeholder="例: 初級">
        </div>
        <div id="result" class="result"></div>
        <button id="submit">結果を見る</button>
    </div>

    <script>
        document.getElementById('submit').addEventListener('click', function() {
            const englishLevel = document.getElementById('englishLevel').value;
            if (!englishLevel) {
                document.getElementById('result').innerText = '入力がありません。';
                return;
            }
            document.getElementById('result').innerText = `あなたのレベルは ${englishLevel} です。`;
        });
    </script>
</body>
