    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学習記録アプリ</title>
    <style>
        body { font-family: Arial, sans-serif; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { text-align: center; margin-bottom: 20px; }
        .input-group { margin-bottom: 10px; }
        .input-group label { display: block; margin-bottom: 5px; }
        .input-group input { width: 100%; padding: 8px; margin-bottom: 10px; }
        .result { margin-top: 20px; }
        .footer { text-align: center; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>学習記録アプリ</h1>
            <p>学生、自習者向けの学習記録管理と最適な学習計画提案</p>
        </div>
        <div class="input-group">
            <label for="lesson">授業名:</label>
            <input type="text" id="lesson" required>
        </div>
        <div class="input-group">
            <label for="date">日付:</label>
            <input type="date" id="date" required>
        </div>
        <div class="input-group">
            <label for="time">時間:</label>
            <input type="time" id="time" required>
        </div>
        <div class="input-group">
            <label for="content">内容:</label>
            <textarea id="content" rows="4" required></textarea>
        </div>
        <button id="save">保存</button>
        <div class="result" id="result"></div>
        <div class="footer">
            <button id="export">CSV出力</button>
        </div>
    </div>

    <script>
        document.getElementById('save').addEventListener('click', function() {
            const lesson = document.getElementById('lesson').value;
            const date = document.getElementById('date').value;
            const time = document.getElementById('time').value;
            const content = document.getElementById('content').value;

            if (lesson && date && time && content) {
                document.getElementById('result').innerText = `授業名: ${lesson}\n日付: ${date}\n時間: ${time}\n内容: ${content}`;
            } else {
                alert('すべてのフィールドを入力してください。');
            }
        });

        document.getElementById('export').addEventListener('click', function() {
            const result = document.getElementById('result').innerText;
            if (result) {
                const csvContent = 'data:text/csv;charset=utf-8,' + encodeURIComponent(result);
                const link = document.createElement('a');
                link.href = csvContent;
                link.download = '学習記録.csv';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            } else {
                alert('保存データがありません。');
            }
        });
    </script>
</body>
</html>
