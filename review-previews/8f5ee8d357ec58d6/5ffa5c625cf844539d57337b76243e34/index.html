 const methods={getItem:k=>raw.getItem(prefix+String(k)),setItem:(k,v)=>raw.setItem(prefix+String(k),String(v)),removeItem:k=>raw.removeItem(prefix+String(k)),clear:()=>keys().forEach(k=>raw.removeItem(prefix+k)),key:i=>keys()[Number(i)]??null};

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ドキュメント自動化ツール</title>
    <style>
        body { font-family: Arial, sans-serif; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .input-group { margin-bottom: 15px; }
        .result { margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>ドキュメント自動化ツール</h1>
        <div class="input-group">
            <label for="inputText">テキスト入力:</label>
            <input type="text" id="inputText" placeholder="入力してください">
        </div>
        <div class="input-group">
            <label for="inputNumber">数値入力:</label>
            <input type="number" id="inputNumber" placeholder="数値を入力">
        </div>
        <button onclick="calculate()">計算</button>
        <div class="result" id="result"></div>
    </div>

    <script>
        function calculate() {
            const inputText = document.getElementById('inputText').value;
            const inputNumber = parseFloat(document.getElementById('inputNumber').value);
            const resultElement = document.getElementById('result');

            if (isNaN(inputNumber)) {
                resultElement.textContent = '数値を正しく入力してください';
                return;
            }

            const result = inputText.repeat(inputNumber);
            resultElement.textContent = `結果: ${result}`;

            // データをlocalStorageに保存
            localStorage.setItem('lastResult', result);
        }

        // 保存された結果を表示
        const lastResult = localStorage.getItem('lastResult');
        if (lastResult) {
            document.getElementById('result').textContent = `結果: ${lastResult}`;
        }
    </script>
</body>
</html>
