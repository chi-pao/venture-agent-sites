    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>会議スケジューリング助手</title>
    <style>
        body { font-family: Arial, sans-serif; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .input-group { margin-bottom: 20px; }
        .result { margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>会議スケジューリング助手</h1>
        <div class="input-group">
            <label for="participantCount">参加人数</label>
            <input type="number" id="participantCount" min="1" required>
        </div>
        <div class="input-group">
            <label for="meetingDuration">会議時間（分）</label>
            <input type="number" id="meetingDuration" min="1" required>
        </div>
        <button onclick="scheduleMeeting()">スケジュールを提案</button>
        <div class="result" id="result"></div>
    </div>
    <script>
        function scheduleMeeting() {
            const participantCount = document.getElementById('participantCount').value;
            const meetingDuration = document.getElementById('meetingDuration').value;
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '';

            if (participantCount < 1 || meetingDuration < 1) {
                resultDiv.innerHTML = '入力値が正しくありません。';
                return;
            }

            const totalMinutes = participantCount * meetingDuration;
            const hours = Math.floor(totalMinutes / 60);
            const minutes = totalMinutes % 60;

            const result = `会議は${hours}時間${minutes}分の合計時間を必要とします。`;
            resultDiv.innerHTML = result;

            localStorage.setItem('lastResult', result);
        }

        const lastResult = localStorage.getItem('lastResult');
        if (lastResult) {
            document.getElementById('result').innerHTML = lastResult;
        }
    </script>
</body>
</html>
