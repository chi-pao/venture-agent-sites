    <meta charset="UTF-8">

    <title>カスタマーサービスチャットボット</title>
    <style>
        body { font-family: Arial, sans-serif; }
        #result { margin-top: 20px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1>カスタマーサービスチャットボット</h1>
    <form id="inputForm">
        <label for="inputText">入力内容:</label>
        <input type="text" id="inputText" required>
        <button type="submit">処理</button>
    </form>
    <pre id="result"></pre>

    <script>
        document.getElementById('inputForm').addEventListener('submit', function(event) {
            event.preventDefault();
            const inputText = document.getElementById('inputText').value;
            const result = processInput(inputText);
            document.getElementById('result').textContent = result;
        });

        function processInput(text) {
            const result = `入力内容: ${text}\n結果: ${calculateResult(text)}`;
            saveToLocal(result);
            return result;
        }

        function calculateResult(text) {
            const length = text.length;
            return `計算結果: ${length}文字`;
        }

        function saveToLocal(data) {
            localStorage.setItem('chatHistory', JSON.stringify([...JSON.parse(localStorage.getItem('chatHistory') || '[]'), data]));
        }
    </script>
</body>
</html>
