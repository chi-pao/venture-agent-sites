name: Isolated production vision replay
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: venture-vision-probe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  replay:
    strategy:
      fail-fast: false
      matrix:
        product: [attendance, workday]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install streamlit pillow
      - name: Find the latest available real browser evidence
        id: prior
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PRODUCT: ${{ matrix.product }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          name = "live-app-generation-evidence-" + os.environ["PRODUCT"]
          run_id = ""
          for page in range(1, 11):
              url = f"https://api.github.com/repos/{os.environ['REPOSITORY']}/actions/artifacts?per_page=100&page={page}"
              req = urllib.request.Request(url, headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json"})
              with urllib.request.urlopen(req, timeout=30) as response:
                  artifacts = json.load(response)["artifacts"]
              match = next((item for item in artifacts if item["name"] == name and not item["expired"]), None)
              if match:
                  run_id = str(match["workflow_run"]["id"])
                  break
              if len(artifacts) < 100:
                  break
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("run_id=" + run_id + "\n")
          print("Prior evidence run:", run_id or "none; full generation QA must provide new evidence")
          PY
      - uses: actions/download-artifact@v4
        if: steps.prior.outputs.run_id != ''
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.prior.outputs.run_id }}
          name: live-app-generation-evidence-${{ matrix.product }}
          path: prior-evidence
      - name: Install model runtime
        run: curl -fsSL https://ollama.com/install.sh | sh
      - name: Start and load actual vision model
        run: |
          nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          ollama pull qwen2.5vl:3b
      - name: Replay production visual review on real saved evidence
        if: steps.prior.outputs.run_id != ''
        env:
          VENTURE_LIVE_PRODUCT: ${{ matrix.product }}
        run: python -u tests/vision_model_probe.py
      - name: Collect runtime evidence
        if: always()
        run: |
          mkdir -p vision-probe-results
          cp "$RUNNER_TEMP/ollama.log" vision-probe-results/ollama.log
          free -m > vision-probe-results/memory.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-vision-${{ matrix.product }}
          path: vision-probe-results/
