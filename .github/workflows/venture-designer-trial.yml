name: Experimental multimodal designer proof
on:
  push:
    branches: [main]
    paths:
      - 'tests/multimodal_designer_trial.py'
      - '.github/workflows/venture-designer-trial.yml'
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: venture-designer-trial-${{ github.ref }}
  cancel-in-progress: true
jobs:
  replay:
    strategy:
      fail-fast: false
      matrix:
        product: [attendance, workday]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OLLAMA_HOST: http://127.0.0.1:11435
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_NUM_PARALLEL: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install streamlit pillow playwright
      - name: Prepare real Chromium with dependency fallback
        run: |
          python -m playwright install chromium
          if ! python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); b=p.chromium.launch(); b.close(); p.stop()'; then
            python -m playwright install-deps chromium
          fi
          if [ -z "$(fc-list :lang=ja family)" ]; then
            sudo apt-get update
            sudo apt-get install -y fonts-ipafont-gothic
          fi
      - name: Find the latest available real browser evidence
        id: prior
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PRODUCT: ${{ matrix.product }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          names = {"live-app-generation-evidence-" + os.environ["PRODUCT"], "saved-repair-evidence-" + os.environ["PRODUCT"]}
          artifact_name = ""
          run_id = ""
          available = []
          for page in range(1, 11):
              url = f"https://api.github.com/repos/{os.environ['REPOSITORY']}/actions/artifacts?per_page=100&page={page}"
              req = urllib.request.Request(url, headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json"})
              with urllib.request.urlopen(req, timeout=30) as response:
                  artifacts = json.load(response)["artifacts"]
              available.extend(item for item in artifacts if item["name"] in names and not item["expired"] and item["size_in_bytes"] > 50000)
              if len(artifacts) < 100:
                  break
          if available:
              match = max(available, key=lambda item: (item["created_at"], item["id"]))
              run_id = str(match["workflow_run"]["id"])
              artifact_name = match["name"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("run_id=" + run_id + "\n")
              output.write("artifact_name=" + artifact_name + "\n")
          print("Prior evidence run:", run_id or "none; full generation QA must provide new evidence")
          PY
      - uses: actions/download-artifact@v4
        if: steps.prior.outputs.run_id != ''
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.prior.outputs.run_id }}
          name: ${{ steps.prior.outputs.artifact_name }}
          path: prior-evidence
      - name: Install model runtime
        run: curl -fsSL https://ollama.com/install.sh | sh
      - name: Start and load actual vision model
        run: |
          nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:11435/api/tags >/dev/null; then break; fi
            sleep 2
          done
          ollama pull qwen2.5vl:3b
          ollama pull qwen3.5:4b
      - name: Repair saved candidate and rerun real browser and image QA
        if: steps.prior.outputs.run_id != ''
        env:
          VENTURE_LIVE_PRODUCT: ${{ matrix.product }}
        run: python -u tests/multimodal_designer_trial.py
      - name: Collect runtime evidence
        id: evidence
        if: always()
        run: |
          mkdir -p candidate-repair-evidence
          cp "$RUNNER_TEMP/ollama.log" candidate-repair-evidence/ollama.log
          free -m > candidate-repair-evidence/memory.txt
          if [ -f "candidate-repair-evidence/${{ matrix.product }}/live.db" ]; then
            echo "checkpoint=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        if: always() && steps.evidence.outputs.checkpoint == 'true'
        with:
          name: candidate-repair-evidence-${{ matrix.product }}
          path: candidate-repair-evidence/
